servo_bridge:
  ros__parameters:
    serial_port: /dev/ttyACM0
    baud: 115200
    min_deg: 0.0
    max_deg: 180.0
    center_deg: 90.0
    rate_limit_deg_per_s: 180.0
    joint_name: camera_pan_joint
    state_pub_hz: 20.0

pan_scanner:
  ros__parameters:
    center_deg: 90.0
    amplitude_deg: 45.0
    period_s: 4.0
    update_hz: 20.0
    cmd_topic: /servo_bridge/cmd_angle
