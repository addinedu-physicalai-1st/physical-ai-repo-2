# MoveIt Servo 설정 (Jazzy 기준 param 이름). servo.launch.py 가 본 파일을 yaml.safe_load
# 로 읽어 dict 으로 바꾼 뒤 servo_node 의 parameters=[{"moveit_servo": dict}] 로 주입한다.
# ROS 2 의 --params-file 직접 로드는 사용하지 않음 (그 경로는 ros__parameters wrapper 가
# 필요한데 moveit_servo 는 launch-side prefix 만 기대).
#
# 핵심 안전 가드 — 유치원 시나리오. 어린이 손이 D435 시야에 들어오면 즉시 멈춰야 함.
#   · check_collisions: true                        → planning scene (octomap + self) 검사
#   · check_octomap_collisions: true                → ↑ 안에 octomap 포함 시키도록 명시
#   · scene_collision_proximity_threshold: 0.04 m   → octomap voxel ≤ 4cm 면 감속/halt
#   · self_collision_proximity_threshold: 0.02 m    → 양팔끼리 ≤ 2cm 면 halt
#   · collision_check_rate: 50 Hz                   → 20ms 간격 검사
#
# move_group_name / command_out_topic 은 servo.launch.py 가 arm 선택에 따라 override.

publish_period: 0.01
max_expected_latency: 0.1

command_in_type: "speed_units"
scale:
  linear: 0.15
  rotational: 0.4
  joint: 0.5

command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false

# Smoothing 끔 — AccelerationLimitedPlugin 은 추가 `update_period` 등 plugin 전용
# 파라미터가 필요해서 Phase 3 MVP 에선 비활성. 잔뜩 흔들리는 trajectory 가 보이면
# 그때 재활성 + plugin params 추가.
use_smoothing: false

# Planning-scene monitor 는 servo 가 primary 로 — 이렇게 안 하면 move_group 이
# scene 변경 시점에만 monitored_planning_scene 을 publish 하기 때문에 sim 에서 octomap
# 이 비어있을 때 servo 가 robot state 자체를 못 받아 "Waiting to receive robot state
# update" 무한 대기. 자체 PSM 가 /joint_states 를 직접 subscribe 하도록 한다.
# (move_group 도 같이 떠있어 RViz MotionPlanning panel 이 동작 — PSM 두 개 공존 OK.)
is_primary_planning_scene_monitor: true
check_octomap_collisions: true

move_group_name: left_arm          # launch override

lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margins: [0.1]

# 입력 토픽 — node-private (~/...) prefix 라 /servo_node/delta_twist_cmds 등으로 노출.
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
incoming_command_timeout: 0.5

# 출력 — launch 가 sim 이면 /eduping/joint_trajectory, real 이면 /{arm}_arm_controller/joint_trajectory.
command_out_topic: /eduping/joint_trajectory

# 충돌 안전 가드.
check_collisions: true
collision_check_rate: 50.0
self_collision_proximity_threshold: 0.02
scene_collision_proximity_threshold: 0.04
