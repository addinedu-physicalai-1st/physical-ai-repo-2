# 7-DoF 양팔 IK. RViz MotionPlanning 의 interactive marker 가 사용.
# leader teleop 은 joint 1:1 passthrough (IK 안 거침) 라 여기 설정은 RViz 디버깅 용도.
left_arm:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_timeout: 0.02
  solve_type: Distance

right_arm:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_timeout: 0.02
  solve_type: Distance
