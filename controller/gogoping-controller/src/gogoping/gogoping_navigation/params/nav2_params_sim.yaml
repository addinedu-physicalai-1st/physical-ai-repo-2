# gogoping_navigation/params/nav2_params_sim.yaml
#
# vicpinky_navigation/params/nav2_params.yaml 의 verbatim copy + 다음 변경:
#   * use_sim_time: True (gz Sim 사용)
#   * 모든 frame 에 `gogoping/` prefix:
#       base_footprint → gogoping/base_footprint
#       base_link       → gogoping/base_link
#       odom            → gogoping/odom
#   * scan topic 절대경로화: /scan_filtered → /gogoping/scan
#     (laser_filters 미설치 환경 호환을 위해 sim 에서는 raw scan 직접 사용.
#      ros-jazzy-laser-filters 설치 후 sim_with_nav2.launch.xml 의 laser_filters
#      노드를 활성화하면 /gogoping/scan_filtered 로 바꿔 footprint 폴리곤 제거 가능.)
#   * odom topic 절대경로화: /odom → /gogoping/odom
#   * AMCL initial pose = spawn pose (0.20, -7.00, yaw=1.5708)
#
# nav2 노드는 root namespace 에서 띄우고 토픽은 모두 /gogoping/* 절대경로로
# 지정한다 (gazebo bridge 가 /tf, /clock 을 root 로 발행하기 때문).

amcl:
  ros__parameters:
    use_sim_time: True
    # ── Motion model (sim 튜닝) ────────────────────────────────────
    # gazebo odom 노이즈 거의 0 → alpha 낮춰 odom 신뢰 ↑.
    # 기본 0.2 는 실물용. sim 에선 0.05 가 정확.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "gogoping/base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    # ── Beams (sim 2차 튜닝) ───────────────────────────────────────
    # 60 → 180 으로 늘려 라이다 광선 더 많이 사용 → 대칭 환경 disambiguation ↑.
    max_beams: 180
    # ── Particle count (sim 튜닝) ──────────────────────────────────
    # 어려운 환경 (대칭/긴 복도) 대응 위해 늘림.
    max_particles: 5000
    min_particles: 1000
    odom_frame_id: "gogoping/odom"
    pf_err: 0.05
    pf_z: 0.99
    # ── Recovery (sim 2차 튜닝) ────────────────────────────────────
    # local minimum 에 갇혔을 때 자가 재분포 강화 (0.1 → 0.2).
    recovery_alpha_fast: 0.2
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    # ── Sensor model (sim 2차 튜닝) ────────────────────────────────
    # sigma_hit 0.05 는 너무 엄격해서 작은 노이즈에도 매칭 실패 → local min 갇힘.
    # 0.1 (10cm) 로 약간 완화하면서, z_hit/z_rand 비율 조정으로 정확 매칭 가중치 ↑.
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    # ── Update threshold (sim 튜닝) ────────────────────────────────
    # 더 자주 업데이트 → drift 누적 방지.
    update_min_a: 0.1
    update_min_d: 0.1
    # ── Sensor mixture (sim 2차 튜닝) ──────────────────────────────
    # z_hit ↑ / z_rand ↓ → 정확 매칭에 가중, 우연 매칭 억제 → 갇힘 회피.
    z_hit: 0.7
    z_max: 0.05
    z_rand: 0.3
    z_short: 0.05
    scan_topic: /gogoping/scan
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0


bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: gogoping/base_footprint
    odom_topic: /gogoping/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      # yaw 무시 — 도착 후 회전 안 함 (자연스러운 종료)
      yaw_goal_tolerance: 3.14
    # RPP — Regulated Pure Pursuit. 좁은 통로 추종 안정성 > DWB sampling.
    # DWB 가 다양한 trajectory 시뮬레이션 중 잘못 선택해 벽으로 가는 문제 회피.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.20
      lookahead_dist: 1.2
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # 충돌 예측 비활성화 — 새 map (real_lidar 통합) 의 wall 노이즈로 자꾸 멈춤 방지
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 3.0
      # 곡률 + 비용 기반 속도 조절 — 코너에서 자동 감속
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.05
      # ⚠ Vic Pinky 제원상 제자리 회전 금지 (캐스터 휠 제약) — 항상 직진+회전 동시
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 3.14
      max_angular_accel: 1.5
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.5


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: gogoping/odom
      robot_base_frame: gogoping/base_link
      use_sim_time: True
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # Vic Pinky 실측 (docs/robots/vic-pinky.md):
      #   본체 길이 0.6 m, 본체 폭 0.4 m, 휠 간격 0.475 m + 휠 두께 0.05 m = 휠 외측 0.525 m
      # 반치수: x ±0.30 (길이/2), y ±0.2625 (휠 외측 폭/2)
      footprint: '[[0.30, -0.2625], [0.30, 0.2625], [-0.30, 0.2625], [-0.30, -0.2625]]'
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # LOCAL: 좁은 문 (0.885m) 통과 가능 위해 작게
        inflation_radius: 0.18
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /gogoping/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: gogoping/base_footprint
      use_sim_time: True
      # Vic Pinky 실측 (docs/robots/vic-pinky.md):
      #   본체 길이 0.6 m, 본체 폭 0.4 m, 휠 간격 0.475 m + 휠 두께 0.05 m = 휠 외측 0.525 m
      # 반치수: x ±0.30 (길이/2), y ±0.2625 (휠 외측 폭/2)
      footprint: '[[0.30, -0.2625], [0.30, 0.2625], [-0.30, 0.2625], [-0.30, -0.2625]]'
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /gogoping/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # GLOBAL: 크게 → planner 가 통로 중앙으로 path 그리도록
        inflation_radius: 0.35
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: gogoping/odom
    global_frame: map
    robot_base_frame: gogoping/base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "CLOSED_LOOP"
    max_velocity: [0.25, 0.0, 1.0]
    min_velocity: [-0.25, 0.0, -1.0]
    max_accel: [1.8, 0.0, 2.0]
    max_decel: [-1.8, 0.0, -2.0]
    odom_topic: "/gogoping/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
