# gogoping_navigation/params/nav2_params_real.yaml
#
# 실물 노트북용 nav2 params (풀스택 — map_server + AMCL + planner + controller +
# bt_navigator + behavior + waypoint_follower + velocity_smoother + costmap).
#
# planner=ThetaStar, controller=RPP — sim (nav2_params_sim.yaml) 과 동기화.
# SW 튜닝만 sim 과 동기화, HW 스펙 (footprint, raytrace_min_range, AMCL 노이즈) 은
# real 값 유지. 추종 전용 FollowPersonPath/follow_person_goal_checker 는 real 전용 유지.
#
# nav2_params_sim.yaml 과의 차이:
#   * use_sim_time: False           (실 시계 사용 — gazebo /clock 불필요)
#   * AMCL 모션모델 alpha: 0.2      (실 휠 encoder 노이즈 반영, sim 의 0.05 와 다름)
#   * AMCL sigma_hit: 0.05          (실 LIDAR 정밀도 — sim 의 0.1 보다 엄격)
#   * AMCL initial_pose:            실 환경 spawn 위치 (지금은 sim 과 동일 0.0/0.0/yaw=0 둠.
#                                    launch arg `initial_pose_x/y/yaw` 로 override 가능)
#   * frame_id: namespace 없음      (실물 vicpinky_bringup 의 TF: odom / base_footprint / base_link)
#                                    sim 은 gogoping/base_footprint 등 namespace 사용.
#   * 토픽 경로는 동일: /gogoping/scan, /gogoping/odom, /gogoping/cmd_vel (Pi 의 push-ros-namespace 결과)
#
# nav2 노드는 root namespace 에서 띄우고 토픽은 /gogoping/* 절대경로 — sim 과 동일 정책.

amcl:
  ros__parameters:
    use_sim_time: false
    # 모션모델 — 실 휠 encoder 노이즈 반영
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 5000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.2
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    # 센서 모델 — 실 LIDAR 정밀도 (sim 보다 sigma 작게)
    sigma_hit: 0.05
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.2
    z_hit: 0.7
    z_max: 0.05
    z_rand: 0.3
    z_short: 0.05
    scan_topic: /gogoping/scan_filtered
    set_initial_pose: true
    initial_pose:
      x: 0.2796
      y: 12.0307
      z: 0.0
      yaw: -1.5708   # -90° — map 기준 아래쪽(-Y) 방향


map_server:
  ros__parameters:
    use_sim_time: false
    # yaml_filename 은 launch 에서 override (real_lidar_map.yaml)
    topic_name: "map"
    frame_id: "map"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true


bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /gogoping/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    goal_checker_plugins: ["general_goal_checker", "follow_person_goal_checker"]
    controller_plugins: ["FollowPath", "FollowPersonPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30  # 0.20 → 0.30 (vertex 사이 정지 폭 ↓ — chain 중간 지점은 30cm 통과만 해도 OK)
      # yaw 무시 — 도착 후 회전 안 함 (sim 과 동일 정책)
      yaw_goal_tolerance: 3.14
    # 추종 전용 — 정밀 도착 불필요, robot 가 좌우 흔들 안 함이 우선.
    # follow_node 의 GOAL_CHANGE_THRESHOLD_M=2.0 과 묶여 동작.
    follow_person_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.60
      yaw_goal_tolerance: 3.14
    # RPP — Regulated Pure Pursuit. 좁은 통로 추종 안정성 > DWB sampling.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.20  # default — preempt next-goal 로 drift 자동 해결
      lookahead_dist: 1.2
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05   # sim 동기화 (real 0.10 → sim 0.05)
      approach_velocity_scaling_dist: 0.6   # sim 동기화 (real 0.3 → sim 0.6)
      # 충돌 예측 비활성화 — map 의 wall 노이즈로 자꾸 멈춤 방지
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 3.0
      # 곡률 + 비용 기반 속도 조절 — 코너에서 자동 감속
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 3.14
      max_angular_accel: 1.5
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.5
    # ─── 추종 전용 controller ──────────────────────────────────────────────
    # follow_node 가 send_goal 시 controller_id="FollowPersonPath" 로 호출.
    # FollowPath 와 동일 RPP plugin 이지만 사용자 따라가는 동적 path 에
    # 적합하도록 lookahead 더 멀리 + 도착 tolerance 완화로 잔진동 차단.
    # 다른 흐름 (Nav2 vertex 이동, 충전 도킹) 은 기존 FollowPath 그대로 사용.
    FollowPersonPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.20
      lookahead_dist: 1.5
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 3.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 3.14
      max_angular_accel: 1.5
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.5


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Vic Pinky 실측: 본체 0.6 × 0.4 m, 휠 외측 0.525 m → 반치수 x ±0.30, y ±0.2625
      # v1.0.0 base_link = 휠축. 앞 +0.10 / 뒤 -0.50 / 좌우 ±0.2625 (휠 외측)
      footprint: '[[0.10, -0.2625], [0.10, 0.2625], [-0.50, 0.2625], [-0.50, -0.2625]]'
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # LOCAL: 좁은 문 (0.885m) 통과 가능 위해 작게
        inflation_radius: 0.10
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          # polygon filter (vicpinky_bringup laser_filter.yaml) 가 base_link body 제거
          # → 로봇 근처 자기몸체 잡티 방지. pi.launch scan_to_scan_filter_chain 출력.
          topic: /gogoping/scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.35
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      # v1.0.0 base_link = 휠축. 앞 +0.10 / 뒤 -0.50 / 좌우 ±0.2625 (휠 외측)
      footprint: '[[0.10, -0.2625], [0.10, 0.2625], [-0.50, 0.2625], [-0.50, -0.2625]]'
      resolution: 0.05
      track_unknown_space: true
      # obstacle_layer 제외 — global 은 static 맵(벽)만으로 경로계획. 사람/동적 장애물이
      # 전역 지도에 마킹되어 "발자국 trail"(1Hz 갱신이라 느리게 지워짐) + 불필요한 전역
      # 재계획을 유발하던 문제 제거. 동적 회피는 local costmap(10Hz) + ProximitySafetyMonitor 담당.
      plugins: ["static_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /gogoping/scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.35
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # GLOBAL: 크게 → planner 가 통로 중앙으로 path 그리도록
        inflation_radius: 0.35
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    # ThetaStar — sim (nav2_params_sim.yaml) 과 동기화. sim param 픽스 정책에 맞춰
    # 기존 Smac2D 에서 교체 (planner 만 sim 일치, HW/프레임은 real 유지).
    GridBased:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    # nav2 controller 출력(cmd_vel_nav)을 받아 LiDAR stop zone gate → cmd_vel_nav_safe
    # (velocity_smoother 입력). FOLLOW 의 reactive cmd_vel_raw 는 이 경로를 안 거침.
    cmd_vel_in_topic: "/gogoping/cmd_vel_nav"
    cmd_vel_out_topic: "/gogoping/cmd_vel_nav_safe"
    state_topic: "collision_monitor_state"     # → /collision_monitor_state (collision_subscriber 구독)
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: false               # 저속(0.15m/s) — odom 보정 불필요, frame 의존 ↓
    stop_pub_timeout: 2.0
    polygons: ["StopZone"]
    StopZone:
      type: "polygon"
      # base_footprint 기준 [전방, 좌우] 범퍼 (m). Vic Pinky 소형 + 저속 → 타이트.
      # 튜닝: 너무 자주 멈추면 축소, 충돌 위험 시 확대.
      points: "[[0.40, 0.20], [0.40, -0.20], [-0.12, -0.20], [-0.12, 0.20]]"
      action_type: "stop"
      min_points: 4
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/gogoping/scan_filtered"
      enabled: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "CLOSED_LOOP"
    # angular max — 1.0 → 0.6 rad/s (~34°/s, 부드러운 회전)
    max_velocity: [0.25, 0.0, 0.6]
    min_velocity: [-0.25, 0.0, -0.6]
    # angular accel/decel (3번째) — RPP 의 과한 각속도 변화 댐핑 (2.0 → 1.0)
    max_accel: [1.8, 0.0, 1.0]
    max_decel: [-1.8, 0.0, -1.0]
    odom_topic: "/gogoping/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
