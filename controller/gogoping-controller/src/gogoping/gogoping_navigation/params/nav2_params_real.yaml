# gogoping_navigation/params/nav2_params_real.yaml
#
# 실물 노트북용 nav2 params (현재는 localization stack 만 사용 — map_server + AMCL).
# planner / controller / bt_navigator 등 풀스택 nav2 는 추후.
#
# nav2_params_sim.yaml 과의 차이:
#   * use_sim_time: False           (실 시계 사용 — gazebo /clock 불필요)
#   * AMCL 모션모델 alpha: 0.2      (실 휠 encoder 노이즈 반영, sim 의 0.05 와 다름)
#   * AMCL sigma_hit: 0.05          (실 LIDAR 정밀도 — sim 의 0.1 보다 엄격)
#   * AMCL initial_pose:            실 환경 spawn 위치 (지금은 sim 과 동일 0.2/-7.0 둠.
#                                    launch arg `initial_pose_x/y/yaw` 로 override 가능)
#   * 토픽 경로는 동일: /gogoping/scan (Pi sllidar 가 동일 namespace 로 발행)
#
# nav2 노드는 root namespace 에서 띄우고 토픽은 /gogoping/* 절대경로 — sim 과 동일 정책.

amcl:
  ros__parameters:
    use_sim_time: False
    # 모션모델 — 실 휠 encoder 노이즈 반영
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "gogoping/base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 5000
    min_particles: 1000
    odom_frame_id: "gogoping/odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.2
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    # 센서 모델 — 실 LIDAR 정밀도 (sim 보다 sigma 작게)
    sigma_hit: 0.05
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.2
    z_hit: 0.7
    z_max: 0.05
    z_rand: 0.3
    z_short: 0.05
    scan_topic: /gogoping/scan
    set_initial_pose: true
    initial_pose:
      x: 0.20
      y: -7.00
      z: 0.0
      yaw: 1.5708


map_server:
  ros__parameters:
    use_sim_time: False
    # yaml_filename 은 launch 에서 override (real_lidar_map.yaml)
    topic_name: "map"
    frame_id: "map"
