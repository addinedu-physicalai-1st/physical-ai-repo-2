servo_bridge:
  ros__parameters:
    # udev rule (/etc/udev/rules.d/99-arduino-camera.rules) 로 vendor:product:serial
    # 매칭하여 항상 /dev/arduino-camera 로 잡히게 한다. 자세한 규칙은
    # gogoping_camera_pan/CLAUDE.md 의 "udev rule" 섹션 참조.
    serial_port: /dev/arduino-camera
    baud: 115200
    pan:
      min_deg: 5.0
      max_deg: 175.0
      center_deg: 90.0
    tilt:
      min_deg: 30.0
      max_deg: 150.0
      center_deg: 90.0
    rate_limit_deg_per_s: 180.0
    pan_joint_name: camera_pan_joint
    tilt_joint_name: camera_tilt_joint
    state_pub_hz: 20.0

keyboard_teleop:
  ros__parameters:
    step_deg: 5.0
    pan:
      min_deg: 5.0
      max_deg: 175.0
      center_deg: 90.0
    tilt:
      min_deg: 30.0
      max_deg: 150.0
      center_deg: 90.0
    pan_topic: /servo_bridge/cmd_pan
    tilt_topic: /servo_bridge/cmd_tilt

pan_scanner:
  ros__parameters:
    center_deg: 90.0
    amplitude_deg: 45.0
    period_s: 4.0
    update_hz: 20.0
    cmd_topic: /servo_bridge/cmd_pan
