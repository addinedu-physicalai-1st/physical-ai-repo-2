name: ox_quiz
display: "OX 퀴즈"

hardware:
  cameras:
    - id: overhead
      role: marker_detection
      resolution: [1280, 720]
      fps: 30
      sim:
        source: webcam
        index: 0
      real:
        source: usb
        # `ls /dev/v4l/by-id` 로 실제 카메라 id 채우기.
        by_id: "PLACEHOLDER-overhead-cam"

  arms:
    - id: pointer
      model: omx_f
      ros_namespace: /noriarm/pointer
      role: answer_pointer
      # arm_controller (JointTrajectoryController) 가 받는 토픽. sim/real 모두 동일 —
      # open_manipulator_bringup 의 controller manifest 가 양쪽 동일하게 'arm_controller' 사용.
      controller_topic: /arm_controller/joint_trajectory
      # arm_controller 가 소유한 5축 (gripper 는 별도). trajectory JSON 의 6번째 컬럼(gripper)
      # 은 자동으로 제거된다.
      controller_joint_names: [joint1, joint2, joint3, joint4, joint5]
      sim:
        # joint_state_only: ros2_control / Gazebo 없이 /joint_states 만 frame-by-frame
        # publish 한다. Control Server 의 SSE 엔드포인트가 이 토픽을 구독해 Robot UI 의
        # three.js URDF 뷰어로 흘린다 (rosbridge / roslibjs 미사용). 물리 시뮬은 없음 —
        # OX 퀴즈처럼 녹화 trajectory 재생만 필요한 게임에 적합.
        backend: joint_state_only
        joint_state_topic: /joint_states
        # OMX-F URDF 의 6 joint 중 lerobot 녹화 6 컬럼과 1:1 매핑. URDF 의 mimic joint
        # (gripper_joint_2 = -1 * gripper_joint_1) 는 urdf-loader 가 자동 처리.
        joint_state_names: [joint1, joint2, joint3, joint4, joint5, gripper_joint_1]
        # 각 컬럼의 lerobot 정규화 모드 → URDF 라디안 변환 규칙.
        # lerobot/robots/omx_follower 의 디폴트는 arm = RANGE_M100_100, gripper = RANGE_0_100.
        # 녹화 시 use_degrees=True 였다면 모든 컬럼을 'degrees' 로 바꾸면 됨.
        joint_norm_modes: [m100_100, m100_100, m100_100, m100_100, m100_100, range_0_100]
      real:
        backend: dynamixel
        port: /dev/omx_follower
        baudrate: 1000000

policy:
  kind: rule_based
  module: noriarm_framework.games.ox_quiz.policy_rule
  # rule_based 정책 옵션 — answer ∈ {O, X} → trajectory 파일.
  trajectory_map:
    O: episode_0_trajectory.json
    X: episode_1_trajectory.json
  # smolVLA 로 전환할 때:
  # kind: smolvla
  # module: noriarm_framework.games.ox_quiz.policy_smolvla
  # checkpoint: checkpoints/ox_v1
  # device: cuda:0

runtime:
  rate_hz: 30
  episode_timeout_s: 30
