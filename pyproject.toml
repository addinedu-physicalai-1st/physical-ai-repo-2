[project]
name = "pingdergarten"
version = "0.1.0"
description = "Pingdergarten — educational robot service"
requires-python = ">=3.11"
dependencies = [
  # 스크립트 공통
  "requests",
  "python-dotenv",
  "mistune>=3.0",
  # AI Hub / Control Service
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "es-hangul>=0.1.0",
  "pydantic>=2.9",
  # DB / 인증
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "edge-tts>=6.1.0",
  "fastapi-users[sqlalchemy]>=14",
  "python-multipart>=0.0.9",
  "pgvector>=0.3",
  # 얼굴 인식
  "insightface>=0.7",
  "onnxruntime>=1.18",
  "opencv-python-headless>=4.10",
  "mediapipe>=0.10",
  # Admin UI
  "PyQt5>=5.15",
  "PyQtWebEngine>=5.15",
  # Arduino serial bridge (gogoping_camera_pan)
  "pyserial>=3.5",
  # Admin UI ↔ Control Server teleop (HTTP/WS)
  "websockets>=13",
  # Pi 측 v4l2 직접 캡처 (camera_streamer_v4l2.py — Linux 전용)
  "linuxpy>=0.24; sys_platform == 'linux'",
  # NoriArm 게임 프레임워크 매니페스트 (YAML)
  "pyyaml>=6.0",
  # OpenArm mini (Feetech STS3215) leader 읽기 — `import scservo_sdk as scs`
  "feetech-servo-sdk>=1.0",
  # AI Hub vision 추론 (YOLO-World) — 첫 실행 시 가중치 자동 다운로드
  "ultralytics>=8.4,<9",
  # ultralytics 의 ByteTrack 이 Linear Assignment Problem solver 로 lap 사용.
  # gogoping_perception 의 yolo.track(tracker="bytetrack.yaml") 에 필수.
  "lap>=0.5.12",
  # 휴대전화 STT (MediaRecorder 클립 → /api/stt). 첫 실행 시 모델(tiny ~75MB) 자동 다운로드.
  "faster-whisper>=1.0",
  # ROS 2 jazzy 빌드 — colcon + rosidl_generator_* 가 empy 3.x API 사용 (4.x 와 비호환).
  # conda env 가 transitive 로 4.x 끌어가는 경우 빌드 시 TransientParseError 발생하므로 핀.
  "empy==3.3.4",
  "pydub>=0.25.1",
  # GogoPing FSM (gogoping_modes/fsm/robot_fsm.py) — pytransitions state machine
  "transitions>=0.9",
  # GogoPing BT 본체 — py_trees 2.2.x (py-trees-spike.md 의 spike 가 2.2 기준)
  "py-trees>=2.2,<2.3",
  # WebRTC — control-service 가 브라우저와 PeerConnection 으로 양방향 audio + DataChannel.
  # Opus 디코딩/인코딩에 av (pyav) 의존.
  "aiortc>=1.9",
  "av>=12",
  # GogoPing 노트북 D435 캡처 (gogoping_camera). WebRTC 송출은 위의 aiortc / av 재사용.
  "pyrealsense2>=2.55",
  # NoriArm 블럭쌓기 — ACT 체크포인트 다운로드.
  "huggingface_hub>=0.25",
  # NoriArm 블럭쌓기 — ACT (Action Chunking Transformer) 모방학습 추론.
  # 첫 실행 시 PyTorch + torchvision 을 transitive 로 끌어옴 (~2GB).
  "lerobot>=0.1",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "anyio[trio]>=4",
  "pytest-anyio>=0.0.0",
  "pytest-asyncio>=0.24",
  "pytest-qt>=4.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "ollama: 실 Ollama HTTP 호출 — 로컬 11434 띄운 상태에서만 실행 (scripts/test.sh 가 자동 감지)",
    "llm_smoke: 매우 가벼운 LLM 연결 확인용 (RUN_LLM_SMOKE=1 일 때만)",
    "ros: ROS2 통합 테스트 — rclpy 환경 필요",
]

[tool.setuptools.packages.find]
where = ["service/control-service", "service/ai-service", "db/control-db"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
