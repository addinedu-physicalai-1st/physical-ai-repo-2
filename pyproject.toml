[project]
name = "pingdergarten"
version = "0.1.0"
description = "Pingdergarten — educational robot service"
requires-python = ">=3.11"
dependencies = [
  # 스크립트 공통
  "requests",
  "python-dotenv",
  "mistune>=3.0",
  # AI Hub / Control Service
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # DB / 인증
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "edge-tts>=6.1.0",
  "fastapi-users[sqlalchemy]>=14",
  "python-multipart>=0.0.9",
  "pgvector>=0.3",
  # 얼굴 인식
  "insightface>=0.7",
  "onnxruntime>=1.18",
  "opencv-python-headless>=4.10",
  # Admin UI
  "PyQt5>=5.15",
  # Arduino serial bridge (gogoping_camera_pan)
  "pyserial>=3.5",
  # Admin UI ↔ Control Server teleop (HTTP/WS)
  "websockets>=13",
  # Pi 측 v4l2 직접 캡처 (camera_streamer_v4l2.py — Linux 전용)
  "linuxpy>=0.24; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "anyio[trio]>=4",
  "pytest-anyio>=0.0.0",
  "pytest-asyncio>=0.24",
  "pytest-qt>=4.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.setuptools.packages.find]
include = ["server*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
