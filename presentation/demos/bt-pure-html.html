<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BT 하이라이팅 — Pure HTML</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0A1628; --surface: #112236; --border: #1E3A5A;
      --text: #E2EEFF; --sub: #7BA5C8; --accent: #38BDF8;
      --green: #34D399; --yellow: #FBBF24; --red: #F87171; --purple: #A78BFA;
    }

    html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg); color: var(--text); overflow-x: hidden;
    }

    /* ── 슬라이드 ── */
    .slide {
      width: 100vw; height: 100vh; scroll-snap-align: start;
      display: flex; flex-direction: column; justify-content: center;
      padding: 40px 8vw; position: relative;
      background-image: radial-gradient(rgba(56,189,248,0.05) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    h2 { font-size: 1.8rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .tag {
      display: inline-block; background: #0E2840; color: var(--accent);
      padding: 3px 14px; border-radius: 100px; font-size: 0.7rem;
      font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .divider { width: 100px; height: 3px; background: rgba(56,189,248,0.5); margin: 8px 0 16px; }

    /* ── BT 노드 ── */
    .bt-svg { width: 100%; max-width: 960px; height: auto; }

    .bt-node rect, .bt-node circle {
      fill: var(--surface); stroke: var(--border); stroke-width: 2; rx: 8;
      transition: fill 0.5s, stroke 0.5s, filter 0.5s;
      cursor: pointer;
    }
    .bt-node circle { rx: 0; }
    .bt-node text {
      font-family: 'Noto Sans KR', sans-serif; font-size: 13px;
      fill: var(--sub); transition: fill 0.4s; pointer-events: none;
    }
    .bt-edge {
      stroke: var(--border); stroke-width: 2; fill: none;
      transition: stroke 0.5s, stroke-dashoffset 0.8s;
    }

    /* 상태 클래스 */
    .bt-node.active rect, .bt-node.active circle {
      fill: #0E2840; stroke: var(--accent); filter: drop-shadow(0 0 14px rgba(56,189,248,0.5));
    }
    .bt-node.active text { fill: var(--text); font-weight: 700; }
    .bt-edge.active { stroke: var(--accent); stroke-width: 2.5; }

    .bt-node.success rect, .bt-node.success circle {
      fill: #082516; stroke: var(--green); filter: drop-shadow(0 0 14px rgba(52,211,153,0.5));
    }
    .bt-node.success text { fill: var(--green); font-weight: 700; }
    .bt-edge.success { stroke: var(--green); stroke-width: 2.5; }

    .bt-node.running rect, .bt-node.running circle {
      fill: #1A2800; stroke: var(--yellow); filter: drop-shadow(0 0 14px rgba(251,191,36,0.5));
    }
    .bt-node.running text { fill: var(--yellow); font-weight: 700; }
    .bt-edge.running { stroke: var(--yellow); stroke-width: 2.5; }

    .bt-node.fail rect, .bt-node.fail circle {
      fill: #2D1010; stroke: var(--red); filter: drop-shadow(0 0 14px rgba(248,113,113,0.5));
    }
    .bt-node.fail text { fill: var(--red); font-weight: 700; }

    /* 펄스 애니메이션 */
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(56,189,248,0.3)); }
      50% { filter: drop-shadow(0 0 20px rgba(56,189,248,0.7)); }
    }
    .bt-node.pulse rect, .bt-node.pulse circle { animation: pulse-glow 1.2s ease-in-out infinite; }

    /* 엣지 flow 애니메이션 */
    .bt-edge.flow {
      stroke-dasharray: 8 4;
      animation: dash-flow 0.8s linear infinite;
    }
    @keyframes dash-flow { to { stroke-dashoffset: -24; } }

    /* ── 컨트롤 패널 ── */
    .controls {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; gap: 8px; align-items: center;
    }
    .ctrl-btn {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      color: var(--sub); padding: 8px 18px; font-size: 0.8rem; cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s;
    }
    .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
    .ctrl-btn.primary { background: #0E2840; border-color: var(--accent); color: var(--accent); }

    /* 설명 박스 */
    .info-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 20px; margin-top: 14px; font-size: 0.88rem;
      color: var(--sub); line-height: 1.6; min-height: 52px;
      transition: all 0.3s;
    }
    .info-box .hl { font-weight: 700; }
    .info-box .bl { color: var(--accent); }
    .info-box .gr { color: var(--green); }
    .info-box .yl { color: var(--yellow); }
    .info-box .rd { color: var(--red); }

    /* 범례 */
    .legend { display: flex; gap: 20px; font-size: 0.75rem; color: var(--sub); margin-top: 10px; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid; }

    /* 타임라인 프로그레스 */
    .timeline {
      width: 100%; max-width: 960px; height: 4px; background: #1E3A5A;
      border-radius: 2px; margin-top: 12px; overflow: hidden;
    }
    .timeline-fill {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width 0.5s ease;
    }

    /* 노드 클릭 툴팁 */
    .tooltip {
      position: fixed; z-index: 200; background: #0D1E33; border: 1px solid var(--accent);
      border-radius: 8px; padding: 10px 16px; font-size: 0.78rem; color: var(--text);
      max-width: 260px; pointer-events: none; opacity: 0; transition: opacity 0.2s;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .tooltip.show { opacity: 1; }
    .tooltip .tt-title { color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .tooltip .tt-desc { color: var(--sub); font-size: 0.72rem; line-height: 1.5; }

    /* 카운터 */
    .counter {
      position: fixed; bottom: 20px; right: 20px; z-index: 100;
      background: rgba(10,22,40,0.9); border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 12px; font-size: 11px; color: #3A5A7A;
    }
  </style>
</head>
<body>

<div class="tooltip" id="tooltip">
  <div class="tt-title" id="tt-title"></div>
  <div class="tt-desc" id="tt-desc"></div>
</div>

<div class="counter" id="counter">1 / 2</div>

        info: '<span class="hl yl">④ Searching</span> — 시야 로스트! 회전하며 "선생님?" 음성 호출' },
      { nodes: { 'fs-confirm': 'success', 'fs-follow': 'active pulse', 'fs-search': 'success' }, edges: { fe1: 'success', fe7: 'success flow' },
        info: '<span class="hl gr">⑤ 재발견!</span> → 추종 재개 (타임아웃 시 대기 복귀)' },
    ],
    timeline: 'tl2', info: 'info2'
  }
};

// ── 상태 관리 ──
let currentSlide = 's1';
let stepIdx = { s1: 0, s2: 0 };
let autoTimer = null;

function clearNodes(slideId) {
  const section = document.getElementById(slideId);
  section.querySelectorAll('.bt-node').forEach(n => n.className.baseVal = 'bt-node');
  section.querySelectorAll('.bt-edge').forEach(e => e.className.baseVal = 'bt-edge');
}

function applyStep(slideId) {
  const sc = scenarios[slideId];
  const step = sc.steps[stepIdx[slideId]];
  clearNodes(slideId);

  for (const [id, cls] of Object.entries(step.nodes || {})) {
    const el = document.getElementById(id);
    if (el && cls) el.className.baseVal = 'bt-node ' + cls;
  }
  for (const [id, cls] of Object.entries(step.edges || {})) {
    const el = document.getElementById(id);
    if (el && cls) el.className.baseVal = 'bt-edge ' + cls;
  }

  document.getElementById(sc.info).innerHTML = step.info;
  const pct = (stepIdx[slideId] / (sc.steps.length - 1)) * 100;
  document.getElementById(sc.timeline).style.width = pct + '%';
}

function next() {
  const sc = scenarios[currentSlide];
  if (stepIdx[currentSlide] < sc.steps.length - 1) {
    stepIdx[currentSlide]++;
    applyStep(currentSlide);
  }
}

function prev() {
  if (stepIdx[currentSlide] > 0) {
    stepIdx[currentSlide]--;
    applyStep(currentSlide);
  }
}

function reset() {
  stopAuto();
  stepIdx[currentSlide] = 0;
  applyStep(currentSlide);
}

function autoPlay() {
  if (autoTimer) { stopAuto(); return; }
  autoTimer = setInterval(() => {
    const sc = scenarios[currentSlide];
    if (stepIdx[currentSlide] >= sc.steps.length - 1) { stopAuto(); return; }
    next();
  }, 1500);
}

function stopAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
}

// ── 키보드 ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'a' || e.key === 'A') autoPlay();
  else if (e.key === 'r' || e.key === 'R') reset();
  else if (e.key === 'ArrowDown') {
    e.preventDefault(); stopAuto();
    document.getElementById('s2').scrollIntoView({ behavior: 'smooth' });
  }
  else if (e.key === 'ArrowUp') {
    e.preventDefault(); stopAuto();
    document.getElementById('s1').scrollIntoView({ behavior: 'smooth' });
  }
});

// ── 슬라이드 전환 감지 ──
const slideObs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      currentSlide = e.target.id;
      document.getElementById('counter').textContent =
        (currentSlide === 's1' ? '1' : '2') + ' / 2';
      applyStep(currentSlide);
    }
  });
}, { threshold: 0.5 });

document.querySelectorAll('.slide').forEach(s => slideObs.observe(s));

// ── 노드 클릭 툴팁 ──
const tooltip = document.getElementById('tooltip');
const ttTitle = document.getElementById('tt-title');
const ttDesc = document.getElementById('tt-desc');

document.querySelectorAll('.bt-node').forEach(node => {
  node.addEventListener('click', (e) => {
    const tip = node.dataset.tip;
    const desc = node.dataset.desc;
    if (!tip) return;

    ttTitle.textContent = tip;
    ttDesc.textContent = desc || '';
    tooltip.classList.add('show');

    const rect = node.getBoundingClientRect();
    tooltip.style.left = Math.min(rect.left + rect.width / 2, window.innerWidth - 280) + 'px';
    tooltip.style.top = (rect.top - 80) + 'px';

    setTimeout(() => tooltip.classList.remove('show'), 3000);
  });
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.bt-node')) tooltip.classList.remove('show');
});

// 초기 렌더
applyStep('s1');
</script>
