<section class="title-slide">
  <div class="bg-deco">
    <div class="blob" style="width:380px;height:380px;background:var(--babypinkSoft);top:-90px;right:-60px"></div>
    <div class="blob" style="width:300px;height:300px;background:var(--mintSoft);bottom:-90px;left:40px"></div>

    <div class="r flex items-center gap-3 my-4" style="--i:1">

    </div>

    <h1 class="r font-display" style="--i:2;font-size:7em;line-height:1;color:var(--ink);margin:0">
      <span style="color:var(--pinkInk)">ping</span><span style="color:var(--lavInk)">der</span><span style="color:var(--mintInk)">garten</span>

    <p class="r font-display mt-6" style="--i:3;font-size:1.6em;color:var(--ink);line-height:1.5">

    </p>

  </div>

    저희의 답은 AI 교사가 아니라 교사를 돕는 보조입니다. 판단·돌봄은 사람이, 반복·기록·시선의 분산은 로봇이.
