<section>
  <div class="bg-deco">
    <div class="dots"></div>
    <div class="blob" style="width:300px;height:300px;background:var(--babypinkSoft);top:-100px;right:-50px;opacity:.4"></div>
    <div class="blob" style="width:240px;height:240px;background:var(--mintSoft);bottom:-90px;left:-30px;opacity:.4"></div>
  </div>

  <div class="layer" style="padding:40px 60px;height:680px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center">

    <p class="eyebrow eyebrow-pink r" style="--i:0">PAIN POINTS</p>
    <h2 class="s-title r" style="--i:0;font-size:2.4em;margin:6px 0 32px">교사들이 가장 힘들어하는 것</h2>

    <div class="grid grid-cols-3 gap-5">

      <div class="pastel-card r" style="--i:1;border-color:var(--babypinkSoft);background:var(--surface)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
          <span style="background:var(--babypink);color:#16131F;font-family:'Jua';font-size:0.8em;width:32px;height:32px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center">1</span>
          <span class="material-icons-round" style="color:var(--babypink);font-size:30px">visibility</span>
        </div>
        <h3 class="font-display" style="font-size:1.15em;color:var(--ink);line-height:1.3">
          동시에 모두를<br>지켜볼 수 없다
        </h3>
        <p style="color:var(--inkSoft);font-size:0.7em;margin-top:10px;line-height:1.6">
          한 아이를 돌보는 동안<br>다른 11명은 안전 사각지대
        </p>
      </div>

      <div class="pastel-card r" style="--i:2;border-color:var(--lavenderSoft);background:var(--surface)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
          <span style="background:var(--lavInk);color:#16131F;font-family:'Jua';font-size:0.8em;width:32px;height:32px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center">2</span>
          <span class="material-icons-round" style="color:var(--lavInk);font-size:30px">moving</span>
        </div>
        <h3 class="font-display" style="font-size:1.15em;color:var(--ink);line-height:1.3">
          반복적인 운반·정리에<br>시간을 빼앗긴다
        </h3>
        <p style="color:var(--inkSoft);font-size:0.7em;margin-top:10px;line-height:1.6">
          교구 옮기기, 식판 나르기,<br>자료 가져오기로 하루가 간다
        </p>
      </div>

      <div class="pastel-card r" style="--i:3;border-color:var(--mintSoft);background:var(--surface)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
          <span style="background:var(--mintInk);color:#16131F;font-family:'Jua';font-size:0.8em;width:32px;height:32px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center">3</span>
          <span class="material-icons-round" style="color:var(--mintInk);font-size:30px">edit_note</span>
        </div>
        <h3 class="font-display" style="font-size:1.15em;color:var(--ink);line-height:1.3">
          기록·보고에<br>퇴근 후 시간을 쓴다
        </h3>
        <p style="color:var(--inkSoft);font-size:0.7em;margin-top:10px;line-height:1.6">
          12명 일일 보고서, 알림장,<br>학부모 연락은 모두 야근
        </p>
      </div>

    </div>

    <p class="r mt-10 text-center font-display" style="--i:4;color:var(--ink);font-size:1.1em">
      놀이도, 운반도, 기록도 — 전부 <span style="color:var(--pinkInk)">한 사람 몫</span>.
    </p>

  </div>
</section>
