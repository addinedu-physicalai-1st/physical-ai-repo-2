<section class="title-slide">
  <div class="bg-deco">
    <div class="blob" style="width:380px;height:380px;background:var(--babypinkSoft);top:-90px;right:-60px"></div>
    <div class="blob" style="width:300px;height:300px;background:var(--mintSoft);bottom:-90px;left:40px"></div>
    <div class="blob float" style="width:220px;height:220px;background:var(--lavenderSoft);top:60px;left:-40px"></div>
    <div class="dots"></div>
  </div>

  <div class="layer flex flex-col items-center justify-center text-center" style="min-height:680px;padding:0 60px">

    <p class="eyebrow r" style="--i:0;color:var(--inkSoft)">OUR ANSWER</p>

    <div class="r flex items-center gap-3 my-4" style="--i:1">
      <span style="width:48px;height:6px;border-radius:999px;background:var(--babypink)"></span>
      <span style="width:24px;height:6px;border-radius:999px;background:var(--mint)"></span>
      <span style="width:12px;height:6px;border-radius:999px;background:var(--butter)"></span>
    </div>

    <h1 class="r font-display" style="--i:2;font-size:7em;line-height:1;color:var(--ink);margin:0">
      <span style="color:var(--pinkInk)">ping</span><span style="color:var(--lavInk)">der</span><span style="color:var(--mintInk)">garten</span>
    </h1>

    <p class="r font-display mt-6" style="--i:3;font-size:1.6em;color:var(--ink);line-height:1.5">
      <span style="color:var(--pinkInk)">교실에 활기를</span>,
      <span style="color:var(--mintInk)">선생님께 여유를</span>.
    </p>

    <p class="r mt-8" style="--i:4;color:var(--inkSoft);font-size:0.85em;line-height:1.7;max-width:760px">
      유치원에서 아이와 놀아주고 교사를 보조하는<br>
      <b style="color:var(--ink)">교육보조로봇</b> 서비스
    </p>

  </div>
</section>
