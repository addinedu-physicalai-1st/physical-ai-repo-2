<section>
  <div class="bg-deco">
    <div class="dots"></div>
    <div class="blob" style="width:280px;height:280px;background:var(--babypinkSoft);top:-90px;left:-40px;opacity:.4"></div>
    <div class="blob" style="width:240px;height:240px;background:var(--butterSoft);bottom:-80px;right:-30px;opacity:.4"></div>
  </div>

  <div class="layer" style="padding:50px 80px;height:680px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center">

    <p class="eyebrow eyebrow-pink r" style="--i:0">SOLUTION</p>
    <h2 class="s-title r" style="--i:0;margin:6px 0 36px">네 가지 약속</h2>

    <div class="grid grid-cols-2 gap-6">

      <div class="pastel-card r" style="--i:1;border-color:var(--babypinkSoft);background:var(--surface);display:flex;gap:18px;align-items:flex-start;padding:24px">
        <div style="width:54px;height:54px;border-radius:16px;background:var(--babypinkSoft);display:flex;align-items:center;justify-content:center;flex:0 0 auto">
          <span class="material-icons-round" style="font-size:30px;color:var(--pinkInk)">visibility</span>
        </div>
        <div>
          <h3 class="font-display" style="font-size:1.15em;color:var(--ink)">놓치는 아이를 줄입니다</h3>
          <p style="color:var(--inkSoft);font-size:0.72em;margin-top:6px;line-height:1.6">
            로봇이 아이의 표정을 자동으로 살피고<br>중요한 순간을 사진으로 남겨드려요
          </p>
        </div>
      </div>

      <div class="pastel-card r" style="--i:2;border-color:var(--mintSoft);background:var(--surface);display:flex;gap:18px;align-items:flex-start;padding:24px">
        <div style="width:54px;height:54px;border-radius:16px;background:var(--mintSoft);display:flex;align-items:center;justify-content:center;flex:0 0 auto">
          <span class="material-icons-round" style="font-size:30px;color:var(--mintInk)">local_shipping</span>
        </div>
        <div>
          <h3 class="font-display" style="font-size:1.15em;color:var(--ink)">반복 운반을 대신합니다</h3>
          <p style="color:var(--inkSoft);font-size:0.72em;margin-top:6px;line-height:1.6">
            교사를 따라다니거나, 지정한 곳까지<br>스스로 자율 주행으로 짐을 옮깁니다
          </p>
        </div>
      </div>

      <div class="pastel-card r" style="--i:3;border-color:var(--lavenderSoft);background:var(--surface);display:flex;gap:18px;align-items:flex-start;padding:24px">
        <div style="width:54px;height:54px;border-radius:16px;background:var(--lavenderSoft);display:flex;align-items:center;justify-content:center;flex:0 0 auto">
          <span class="material-icons-round" style="font-size:30px;color:var(--lavInk)">extension</span>
        </div>
        <div>
          <h3 class="font-display" style="font-size:1.15em;color:var(--ink)">놀이를 함께 합니다</h3>
          <p style="color:var(--inkSoft);font-size:0.72em;margin-top:6px;line-height:1.6">
            율동·무궁화꽃·블럭쌓기·OX 퀴즈·가게놀이까지<br>총 9가지 놀이로 아이와 어울립니다
          </p>
        </div>
      </div>

      <div class="pastel-card r" style="--i:4;border-color:var(--butterSoft);background:var(--surface);display:flex;gap:18px;align-items:flex-start;padding:24px">
        <div style="width:54px;height:54px;border-radius:16px;background:var(--butterSoft);display:flex;align-items:center;justify-content:center;flex:0 0 auto">
          <span class="material-icons-round" style="font-size:30px;color:var(--butterInk)">auto_stories</span>
        </div>
        <div>
          <h3 class="font-display" style="font-size:1.15em;color:var(--ink)">기록과 보고를 자동화합니다</h3>
          <p style="color:var(--inkSoft);font-size:0.72em;margin-top:6px;line-height:1.6">
            등·하원 시각, 활동 사진, 일일 보고서까지<br>학부모에게 자동으로 전달돼요
          </p>
        </div>
      </div>

    </div>

  </div>
</section>
