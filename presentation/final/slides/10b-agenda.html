<section>
  <div class="layer" style="padding:48px 80px;height:680px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center">

    <p class="eyebrow eyebrow-pink r" style="--i:0">AGENDA</p>
    <h2 class="s-title r" style="--i:0;margin:6px 0 28px">오늘의 순서</h2>

    <div style="display:flex;flex-direction:column;gap:12px">

      <div class="pastel-card r" style="--i:1;border-color:var(--babypinkSoft);display:flex;align-items:center;gap:20px;padding:16px 22px">
        <span class="badge" style="width:52px;height:52px;background:var(--babypink);color:#16131F;font-size:1.1em;flex:0 0 auto">1</span>
        <div style="flex:1">
          <h3 class="font-display" style="font-size:1.1em;color:var(--ink)">도입 — 왜 필요한가</h3>
          <p style="color:var(--inkSoft);font-size:0.72em;margin-top:2px">유치원의 현실 · 선생님의 하루 · 진짜 어려움</p>
        </div>
        <span class="material-icons-round" style="font-size:30px;color:var(--babypink)">lightbulb</span>
      </div>

      <div class="pastel-card r" style="--i:2;border-color:var(--mintSoft);display:flex;align-items:center;gap:20px;padding:16px 22px">
        <span class="badge" style="width:52px;height:52px;background:var(--mint);color:#16131F;font-size:1.1em;flex:0 0 auto">2</span>
        <div style="flex:1">
          <h3 class="font-display" style="font-size:1.1em;color:var(--ink)">만나기 — 세 로봇과 하루 일과</h3>
          <p style="color:var(--inkSoft);font-size:0.72em;margin-top:2px">로봇 라인업 · 유치원 맵 · 하드웨어</p>
        </div>
        <span class="material-icons-round" style="font-size:30px;color:var(--mint)">smart_toy</span>
      </div>

      <div class="pastel-card r" style="--i:3;border-color:var(--butterSoft);display:flex;align-items:center;gap:20px;padding:16px 22px">
        <span class="badge" style="width:52px;height:52px;background:var(--butter);color:#16131F;font-size:1.1em;flex:0 0 auto">3</span>
        <div style="flex:1">
          <h3 class="font-display" style="font-size:1.1em;color:var(--ink)">기능 &amp; 데모</h3>
          <p style="color:var(--inkSoft);font-size:0.72em;margin-top:2px">EduPing · GogoPing · NoriArm — 기능마다 실시연</p>
        </div>
        <span class="material-icons-round" style="font-size:30px;color:var(--butter)">play_circle</span>
      </div>

      <div class="pastel-card r" style="--i:4;border-color:var(--skySoft);display:flex;align-items:center;gap:20px;padding:16px 22px">
        <span class="badge" style="width:52px;height:52px;background:var(--sky);color:#16131F;font-size:1.1em;flex:0 0 auto">4</span>
        <div style="flex:1">
          <h3 class="font-display" style="font-size:1.1em;color:var(--ink)">시스템 — 어떻게 동작하나</h3>
          <p style="color:var(--inkSoft);font-size:0.72em;margin-top:2px">아키텍처 · ROS2 · 데이터 파이프라인 · 시뮬→실물</p>
        </div>
        <span class="material-icons-round" style="font-size:30px;color:var(--sky)">hub</span>
      </div>

      <div class="pastel-card r" style="--i:5;border-color:var(--lavenderSoft);display:flex;align-items:center;gap:20px;padding:16px 22px">
        <span class="badge" style="width:52px;height:52px;background:var(--lavender);color:#16131F;font-size:1.1em;flex:0 0 auto">5</span>
        <div style="flex:1">
          <h3 class="font-display" style="font-size:1.1em;color:var(--ink)">마무리</h3>
          <p style="color:var(--inkSoft);font-size:0.72em;margin-top:2px">Final Demo · 회고 · 팀 — 그리고 부록은 Q&amp;A 자료</p>
        </div>
        <span class="material-icons-round" style="font-size:30px;color:var(--lavender)">flag</span>
      </div>

    </div>

  </div>
</section>
