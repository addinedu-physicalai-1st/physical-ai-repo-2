<section>
  <div class="bg-deco">
    <div class="dots"></div>
    <div class="blob" style="width:300px;height:300px;background:var(--lavenderSoft);top:-100px;right:-60px;opacity:.45"></div>
    <div class="blob float" style="width:200px;height:200px;background:var(--butterSoft);bottom:-60px;left:40px;opacity:.4"></div>
  </div>

  <div class="layer" style="padding:60px 80px;height:680px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center">

    <p class="eyebrow eyebrow-lav r" style="--i:0">OUR MEETING</p>
    <h2 class="s-title r" style="--i:0;margin:6px 0 28px">그날 회의실 칠판에는</h2>

    <div class="pastel-card r" style="--i:1;background:var(--surface);border-color:var(--lavenderSoft);padding:36px 44px">
      <div style="display:flex;flex-direction:column;gap:14px">

        <div class="r" style="--i:2;display:flex;align-items:center;gap:14px">
          <span style="font-family:'Jua';color:var(--pinkInk);font-size:1.4em;flex:0 0 28px">·</span>
          <span style="color:var(--ink);font-size:0.95em">선생님 옆에 <b>한 명 더</b> 있으면 어떨까?</span>
        </div>
        <div class="r" style="--i:3;display:flex;align-items:center;gap:14px">
          <span style="font-family:'Jua';color:var(--mintInk);font-size:1.4em;flex:0 0 28px">·</span>
          <span style="color:var(--ink);font-size:0.95em">아이가 <b>가장 즐거울 때</b>를 누군가 알아채 줬으면.</span>
        </div>
        <div class="r" style="--i:4;display:flex;align-items:center;gap:14px">
          <span style="font-family:'Jua';color:var(--lavInk);font-size:1.4em;flex:0 0 28px">·</span>
          <span style="color:var(--ink);font-size:0.95em">교구 운반은 <b>대신 해주는 친구</b>가 있으면 좋겠다.</span>
        </div>
        <div class="r" style="--i:5;display:flex;align-items:center;gap:14px">
          <span style="font-family:'Jua';color:var(--butterInk);font-size:1.4em;flex:0 0 28px">·</span>
          <span style="color:var(--ink);font-size:0.95em">일일 보고서는 <b>자동으로</b> 채워지면 안 되나?</span>
        </div>
        <div class="r" style="--i:6;display:flex;align-items:center;gap:14px">
          <span style="font-family:'Jua';color:var(--skyInk);font-size:1.4em;flex:0 0 28px">·</span>
          <span style="color:var(--ink);font-size:0.95em">아이들이 <b>좋아할 만한 모습</b>이어야 한다.</span>
        </div>

      </div>
    </div>

    <p class="r mt-8 text-center" style="--i:7;color:var(--inkSoft);font-size:0.85em">
      이 5줄에서 <span class="font-display" style="color:var(--ink)">pingdergarten</span> 이 시작됐습니다.
    </p>

  </div>
</section>
