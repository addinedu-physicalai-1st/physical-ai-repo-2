<section>
  <div style="padding:40px 60px">
    <p style="color:var(--mintInk);font-family:'Jua';letter-spacing:0.2em;font-size:0.7em">SERVICES &amp; ROBOTS</p>
    <h2 class="font-display" style="font-size:2.4em;color:var(--ink);margin-bottom:32px">
      우리 로봇 친구들
    </h2>

    <div class="grid grid-cols-3 gap-5">

      <!-- 에듀핑 -->
      <div class="pastel-card" style="border-color:var(--babypinkSoft);background:var(--surface)">
        <div style="width:100%;height:140px;border-radius:18px;background:var(--babypinkSoft);display:flex;align-items:center;justify-content:center;margin-bottom:14px">
          <span class="material-icons-round" style="font-size:72px;color:var(--babypink)">accessibility_new</span>
        </div>
        <h3 class="font-display" style="font-size:1.4em;color:var(--ink);line-height:1.1">
          에듀핑 <span style="color:var(--babypink);font-size:0.7em">(Eduping)</span>
        </h3>
        <div style="margin-top:10px;padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:999px;display:inline-flex;align-items:center;gap:6px">
          <span class="material-icons-round" style="font-size:14px;color:var(--babypink)">memory</span>
          <span style="color:var(--ink);font-size:0.6em;font-family:'Jua'">OpenArm</span>
        </div>
        <p style="color:var(--ink);font-size:0.6em;margin-top:10px;line-height:1.6">
          등하원 · 율동 · 무궁화 꽃이 피었습니다
        </p>
      </div>

      <!-- 고고핑 -->
      <div class="pastel-card" style="border-color:var(--mintSoft);background:var(--surface)">
        <div style="width:100%;height:140px;border-radius:18px;background:var(--mintSoft);display:flex;align-items:center;justify-content:center;margin-bottom:14px">
          <span class="material-icons-round" style="font-size:72px;color:var(--mintInk)">directions_car</span>
        </div>
        <h3 class="font-display" style="font-size:1.4em;color:var(--ink);line-height:1.1">
          고고핑 <span style="color:var(--mintInk);font-size:0.7em">(Gogoping)</span>
        </h3>
        <div style="margin-top:10px;padding:6px 12px;background:var(--surface);border:1px solid var(--mintSoft);border-radius:999px;display:inline-flex;align-items:center;gap:6px">
          <span class="material-icons-round" style="font-size:14px;color:var(--mintInk)">memory</span>
          <span style="color:var(--ink);font-size:0.6em;font-family:'Jua'">Vic Pinky</span>
        </div>
        <p style="color:var(--ink);font-size:0.6em;margin-top:10px;line-height:1.6">
          교사 추종 · 운반 · 숨바꼭질 · 자장가
        </p>
      </div>

      <!-- 노리암 -->
      <div class="pastel-card" style="border-color:var(--lavenderSoft);background:var(--surface)">
        <div style="width:100%;height:140px;border-radius:18px;background:var(--lavenderSoft);display:flex;align-items:center;justify-content:center;margin-bottom:14px">
          <span class="material-icons-round" style="font-size:72px;color:var(--lavInk)">precision_manufacturing</span>
        </div>
        <h3 class="font-display" style="font-size:1.4em;color:var(--ink);line-height:1.1">
          노리암 <span style="color:var(--lavInk);font-size:0.7em">(Noriarm)</span>
        </h3>
        <div style="margin-top:10px;padding:6px 12px;background:var(--surface);border:1px solid var(--lavenderSoft);border-radius:999px;display:inline-flex;align-items:center;gap:6px">
          <span class="material-icons-round" style="font-size:14px;color:var(--lavInk)">memory</span>
          <span style="color:var(--ink);font-size:0.6em;font-family:'Jua'">OMX</span>
        </div>
        <p style="color:var(--ink);font-size:0.6em;margin-top:10px;line-height:1.6">
          블럭쌓기 · 정리 · OX 퀴즈 · 가게놀이
        </p>
      </div>

    </div>
  </div>
</section>
