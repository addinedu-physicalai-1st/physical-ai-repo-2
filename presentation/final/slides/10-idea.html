<section>
  <div class="bg-deco">
    <div class="dots"></div>
    <div class="blob" style="width:260px;height:260px;background:var(--mintSoft);top:-90px;right:80px;opacity:.4"></div>
  </div>

  <div class="layer" style="padding:50px 60px;height:680px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center">

    <p class="eyebrow eyebrow-mint r" style="--i:0">HOW WE GOT HERE</p>
    <h2 class="s-title r" style="--i:0;margin:6px 0 28px">한 대로는 부족했습니다.</h2>

    <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:18px;margin-bottom:24px">

      <div class="pastel-card text-center r" style="--i:1;border-color:var(--babypinkSoft);padding:18px">
        <div style="width:64px;height:64px;border-radius:18px;background:var(--babypinkSoft);display:inline-flex;align-items:center;justify-content:center">
          <span class="material-icons-round" style="font-size:38px;color:var(--pinkInk)">support</span>
        </div>
        <h3 class="font-display mt-2" style="font-size:1em;color:var(--ink)">아이와 가까이서</h3>
        <p style="color:var(--inkSoft);font-size:0.65em;margin-top:6px;line-height:1.5">
          정문에 상주하며 등·하원<br>인사와 율동을 함께
        </p>
        <div class="chip mt-3" style="font-size:0.55em">EduPing · OpenArm</div>
      </div>

      <div class="pastel-card text-center r" style="--i:2;border-color:var(--mintSoft);padding:18px">
        <div style="width:64px;height:64px;border-radius:18px;background:var(--mintSoft);display:inline-flex;align-items:center;justify-content:center">
          <span class="material-icons-round" style="font-size:38px;color:var(--mintInk)">directions_run</span>
        </div>
        <h3 class="font-display mt-2" style="font-size:1em;color:var(--ink)">교실 사이를 누비며</h3>
        <p style="color:var(--inkSoft);font-size:0.65em;margin-top:6px;line-height:1.5">
          교사 추종·자율 운반<br>숨바꼭질·자장가
        </p>
        <div class="chip chip-mint mt-3" style="font-size:0.55em">GogoPing · Vic Pinky</div>
      </div>

      <div class="pastel-card text-center r" style="--i:3;border-color:var(--lavenderSoft);padding:18px">
        <div style="width:64px;height:64px;border-radius:18px;background:var(--lavenderSoft);display:inline-flex;align-items:center;justify-content:center">
          <span class="material-icons-round" style="font-size:38px;color:var(--lavInk)">touch_app</span>
        </div>
        <h3 class="font-display mt-2" style="font-size:1em;color:var(--ink)">책상 위 놀이를</h3>
        <p style="color:var(--inkSoft);font-size:0.65em;margin-top:6px;line-height:1.5">
          블럭쌓기·OX 퀴즈<br>가게놀이
        </p>
        <div class="chip chip-lavender mt-3" style="font-size:0.55em">NoriArm · OMX × 3</div>
      </div>

    </div>

    <div class="pastel-card r" style="--i:4;border-color:var(--border);background:var(--surface);padding:18px 24px;text-align:center">
      <p style="color:var(--ink);font-size:0.95em;line-height:1.6">
        <span class="font-display" style="color:var(--pinkInk)">세 종류의 로봇</span> 이 역할을 나누고,<br>
        <span class="font-display" style="color:var(--mintInk)">한 목소리</span> 로 선생님을 돕습니다.
      </p>
    </div>

  </div>
</section>
