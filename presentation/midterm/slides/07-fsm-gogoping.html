<section data-scenario="fsm-assist" style="padding:40px 60px">
  <p class="font-display text-em-xs" style="letter-spacing:0.2em;color:#B5E6D8">STATE MACHINE</p>
  <h2 class="font-display text-em-lg mt-1">고고핑 보조 모드 — FSM</h2>

  <svg viewBox="0 0 900 280" style="width:100%;max-width:860px;margin-top:8px">
    <defs>
      <marker id="m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#FFE0E6"/>
      </marker>
    </defs>

    <!-- Edges -->
    <path class="tree-edge" id="fm-e1" d="M200,100 L350,100" marker-end="url(#m-arr)"/>
    <path class="tree-edge" id="fm-e2" d="M520,100 L660,100" marker-end="url(#m-arr)"/>
    <path class="tree-edge" id="fm-e3" d="M740,128 L740,192" marker-end="url(#m-arr)"/>
    <path class="tree-edge" id="fm-e4" d="M660,220 L250,220" marker-end="url(#m-arr)"/>
    <path class="tree-edge" id="fm-e5" d="M170,192 L170,128" marker-end="url(#m-arr)"/>
    <!-- follow → searching -->
    <path class="tree-edge" id="fm-e6" d="M520,128 L470,192" marker-end="url(#m-arr)"/>
    <!-- searching → follow -->
    <path class="tree-edge" id="fm-e7" d="M400,192 L350,128" marker-end="url(#m-arr)"/>

    <!-- Labels on edges -->
    <text x="275" y="90" font-size="9" fill="#8D6E63" text-anchor="middle" font-family="Jua,system-ui">추종 시작</text>
    <text x="590" y="90" font-size="9" fill="#8D6E63" text-anchor="middle" font-family="Jua,system-ui">확인 완료</text>
    <text x="760" y="165" font-size="9" fill="#8D6E63" text-anchor="middle" font-family="Jua,system-ui">도착</text>
    <text x="450" y="210" font-size="9" fill="#8D6E63" text-anchor="middle" font-family="Jua,system-ui">도착 완료</text>
    <text x="500" y="155" font-size="9" fill="#8D6E63" text-anchor="middle" font-family="Jua,system-ui">시야 로스트</text>
    <text x="360" y="165" font-size="9" fill="#8D6E63" text-anchor="middle" font-family="Jua,system-ui">재발견</text>

    <!-- Nodes -->
    <g class="tree-node" id="fm-idle">
      <rect x="90" y="80" width="140" height="40"/>
      <text x="160" y="105" text-anchor="middle">대기</text>
    </g>
    <g class="tree-node" id="fm-confirm">
      <rect x="360" y="80" width="160" height="40"/>
      <text x="440" y="105" text-anchor="middle">추종 대상 확인</text>
    </g>
    <g class="tree-node" id="fm-follow">
      <rect x="670" y="80" width="140" height="40"/>
      <text x="740" y="105" text-anchor="middle">추종</text>
    </g>
    <g class="tree-node" id="fm-search">
      <rect x="380" y="196" width="140" height="40"/>
      <text x="450" y="221" text-anchor="middle">Searching</text>
    </g>
    <g class="tree-node" id="fm-arrive">
      <rect x="670" y="196" width="140" height="40"/>
      <text x="740" y="221" text-anchor="middle">도착</text>
    </g>
  </svg>

  <div class="tree-legend mt-1">
    <div class="tree-legend-item"><div class="tree-legend-dot" style="border-color:#F8B4C4;background:#FFD3DD"></div> Active</div>
    <div class="tree-legend-item"><div class="tree-legend-dot" style="border-color:#B5E6D8;background:#D6F2E8"></div> 완료</div>
    <div class="tree-legend-item"><div class="tree-legend-dot" style="border-color:#FFE5A8;background:#FFF0CC"></div> 이전 상태</div>
  </div>

  <div class="step-info mt-1">
    <span class="font-display" style="color:#F8B4C4">&rarr;</span> 키를 눌러 FSM 전환을 따라가세요.
  </div>

  <span class="fragment" data-fragment-index="1" style="display:none"></span>
  <span class="fragment" data-fragment-index="2" style="display:none"></span>
  <span class="fragment" data-fragment-index="3" style="display:none"></span>
  <span class="fragment" data-fragment-index="4" style="display:none"></span>
  <span class="fragment" data-fragment-index="5" style="display:none"></span>

</section>
