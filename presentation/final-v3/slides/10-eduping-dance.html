<section data-arch-flow>
  <style>
    .ovr-flow-pink-10{position:absolute;top:14px;left:14px;right:14px;z-index:5;display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:none}
    .ovr-flow-pink-10 .n{display:flex;align-items:center;gap:8px;background:rgba(15,18,28,0.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid rgba(244,114,182,0.4);border-radius:10px;padding:7px 14px;opacity:0.55;filter:saturate(0.65);transform:scale(0.97);transition:all .35s cubic-bezier(0.2,0.8,0.2,1)}
    .ovr-flow-pink-10 .n.on{opacity:1;filter:none;transform:scale(1.04);background:rgba(244,114,182,0.92);border-color:var(--babypink);box-shadow:0 0 24px rgba(244,114,182,0.55)}
    .ovr-flow-pink-10 .n .num{font-family:'Jua';font-size:14px;color:var(--babypink);width:18px;text-align:center;flex:0 0 auto}
    .ovr-flow-pink-10 .n.on .num{color:#fff}
    .ovr-flow-pink-10 .n .lab{font-family:'Jua';font-size:13px;color:#fff;letter-spacing:0.02em}
    .ovr-flow-pink-10 .arrow{font-size:18px;color:rgba(244,114,182,0.45);font-weight:700;flex:0 0 auto;transition:color .35s}
    .ovr-flow-pink-10 .arrow.on{color:var(--babypink)}
    .arr-drv{position:absolute;left:-9999px;top:-9999px}
  </style>
  <div style="padding:24px 60px 36px;height:720px;width:1280px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="chip" style="font-size:0.55em;background:linear-gradient(90deg,var(--babypink),var(--lavInk));color:#fff;border:0">EDUPING · 모드 02</span>
      <h2 class="font-display" style="font-size:1.6em;color:var(--ink);margin:0">율동</h2>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;min-height:0">
      <div style="position:relative;aspect-ratio:1920/1072;max-width:100%;max-height:100%;height:100%;border:1px solid var(--border);border-radius:14px;overflow:hidden">
        <div class="ovr-flow-pink-10">
          <div class="n" data-step="1,2,3"><span class="num">1</span><span class="lab">녹화</span></div>
          <span class="arrow" data-flow="2,3">→</span>
          <div class="n" data-step="2,3"><span class="num">2</span><span class="lab">키프레임</span></div>
          <span class="arrow" data-flow="3">→</span>
          <div class="n" data-step="3"><span class="num">3</span><span class="lab">재생</span></div>
        </div>
        <video src="https://images.prismic.io/minsung/aiEehweQX7-eWt64_dance.mp4" loop playsinline data-press-to-play
               style="width:100%;height:100%;object-fit:cover;display:block"
               onerror="this.outerHTML='&lt;div style=&quot;color:var(--inkSoft);text-align:center;padding:40px&quot;&gt;&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:60px&quot;&gt;videocam_off&lt;/span&gt;&lt;p style=&quot;margin-top:12px;font-size:0.85em&quot;&gt;eduping/dance.mp4&lt;/p&gt;&lt;/div&gt;'"></video>
      </div>
    </div>
    <div class="arr-drv" aria-hidden="true">
      <span class="fragment" data-archstep="1"></span>
      <span class="fragment" data-archstep="2"></span>
      <span class="fragment" data-archstep="3"></span>
    </div>
  </div>
  <aside class="notes">율동 — 데모 영상 only. 영상 상단 3단계 블록 overlay.</aside>
</section>
