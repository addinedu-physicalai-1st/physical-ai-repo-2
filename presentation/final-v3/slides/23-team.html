<section>
  <div class="bg-deco">
    <div class="blob" style="width:300px;height:300px;background:var(--babypinkSoft);top:-80px;left:-50px;opacity:0.4"></div>
    <div class="blob" style="width:260px;height:260px;background:var(--mintSoft);bottom:-70px;right:-40px;opacity:0.35"></div>
    <div class="blob float" style="width:200px;height:200px;background:var(--lavenderSoft);top:80px;right:80px;opacity:0.35"></div>
    <div class="dots"></div>
  </div>

  <div class="layer" style="padding:36px 60px 30px;height:720px;width:1280px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;z-index:1">

    <div style="text-align:center;margin-bottom:24px">
      <p style="color:var(--inkSoft);font-family:'Jua';letter-spacing:0.4em;font-size:0.7em;margin:0">사랑의 에듀핑</p>
      <h2 class="font-display" style="font-size:2em;color:var(--ink);margin:8px 0 0">팀 6명</h2>
    </div>

    <div style="flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;min-height:0">

      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="flex:1;width:100%;background:var(--surface);border:2px solid var(--babypink);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:0">
          <span class="material-icons-round" style="font-size:56px;color:var(--babypinkSoft)">person</span>
        </div>
        <h3 class="font-display" style="font-size:1.15em;color:var(--babypink);margin-top:12px;line-height:1">박우림</h3>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="flex:1;width:100%;background:var(--surface);border:2px solid var(--lavInk);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:0">
          <span class="material-icons-round" style="font-size:56px;color:var(--lavenderSoft)">person</span>
        </div>
        <h3 class="font-display" style="font-size:1.15em;color:var(--lavInk);margin-top:12px;line-height:1">이지수</h3>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="flex:1;width:100%;background:var(--surface);border:2px solid var(--mintInk);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:0">
          <span class="material-icons-round" style="font-size:56px;color:var(--mintSoft)">person</span>
        </div>
        <h3 class="font-display" style="font-size:1.15em;color:var(--mintInk);margin-top:12px;line-height:1">노영주</h3>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="flex:1;width:100%;background:var(--surface);border:2px solid var(--butterInk);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:0">
          <span class="material-icons-round" style="font-size:56px;color:var(--butterSoft)">person</span>
        </div>
        <h3 class="font-display" style="font-size:1.15em;color:var(--butterInk);margin-top:12px;line-height:1">이강택</h3>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="flex:1;width:100%;background:var(--surface);border:2px solid var(--skyInk);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:0">
          <span class="material-icons-round" style="font-size:56px;color:var(--skySoft)">person</span>
        </div>
        <h3 class="font-display" style="font-size:1.15em;color:var(--skyInk);margin-top:12px;line-height:1">이정우</h3>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="flex:1;width:100%;background:var(--surface);border:2px solid var(--babypink);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:0">
          <span class="material-icons-round" style="font-size:56px;color:var(--babypinkSoft)">person</span>
        </div>
        <h3 class="font-display" style="font-size:1.15em;color:var(--babypink);margin-top:12px;line-height:1">최민성</h3>
      </div>

    </div>

  </div>
  <aside class="notes">
    팀 6명 — 박우림 · 이지수 · 노영주 · 이강택 · 이정우 · 최민성.
    사진은 추후 placeholder 자리에 채울 예정. 역할은 다음 슬라이드 또는 별도 자료에서 설명.
  </aside>
</section>
