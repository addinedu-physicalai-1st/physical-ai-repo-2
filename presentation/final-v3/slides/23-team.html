<section>
  <div class="bg-deco">
    <div class="blob" style="width:300px;height:300px;background:var(--babypinkSoft);top:-80px;left:-50px;opacity:0.4"></div>
    <div class="blob" style="width:260px;height:260px;background:var(--mintSoft);bottom:-70px;right:-40px;opacity:0.35"></div>
    <div class="blob float" style="width:200px;height:200px;background:var(--lavenderSoft);top:80px;right:80px;opacity:0.35"></div>
    <div class="dots"></div>
  </div>

  <div class="layer" style="padding:32px 60px 24px;height:720px;width:1280px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;z-index:1">

    <div style="text-align:center;margin-bottom:20px">
      <p style="color:var(--inkSoft);font-family:'Jua';letter-spacing:0.4em;font-size:0.7em;margin:0">사랑의 에듀핑</p>
      <h2 class="font-display" style="font-size:2em;color:var(--ink);margin:6px 0 0">팀 6명</h2>
    </div>

    <div style="flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;min-height:0">

      <!-- 박우림 -->
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="aspect-ratio:0.47;width:100%;background:var(--surface);border:2px solid var(--babypink);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <img src="https://images.prismic.io/minsung/aiEgDAeQX7-eWt79_wurim_face.png?auto=format,compress" alt="박우림" style="width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:56px;color:var(--babypinkSoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <h3 class="font-display" style="font-size:1.05em;color:var(--babypink);margin-top:10px;line-height:1">박우림</h3>
        <p style="font-size:0.5em;color:var(--inkSoft);margin-top:4px;line-height:1.3">역할</p>
      </div>

      <!-- 이지수 -->
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="aspect-ratio:0.47;width:100%;background:var(--surface);border:2px solid var(--lavInk);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <img src="https://images.prismic.io/minsung/aiEf_geQX7-eWt72_jisoo_face.png?auto=format,compress" alt="이지수" style="width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:56px;color:var(--lavenderSoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <h3 class="font-display" style="font-size:1.05em;color:var(--lavInk);margin-top:10px;line-height:1">이지수</h3>
        <p style="font-size:0.5em;color:var(--inkSoft);margin-top:4px;line-height:1.3">역할</p>
      </div>

      <!-- 노영주 -->
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="aspect-ratio:0.47;width:100%;background:var(--surface);border:2px solid var(--mintInk);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <img src="https://images.prismic.io/minsung/aiEgDgeQX7-eWt7-_youngju_face.jpg?auto=format,compress" alt="노영주" style="width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:56px;color:var(--mintSoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <h3 class="font-display" style="font-size:1.05em;color:var(--mintInk);margin-top:10px;line-height:1">노영주</h3>
        <p style="font-size:0.5em;color:var(--inkSoft);margin-top:4px;line-height:1.3">역할</p>
      </div>

      <!-- 이강택 -->
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="aspect-ratio:0.47;width:100%;background:var(--surface);border:2px solid var(--butterInk);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <img src="https://images.prismic.io/minsung/aiEgBgeQX7-eWt76_kangtaek_face.png?auto=format,compress" alt="이강택" style="width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:56px;color:var(--butterSoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <h3 class="font-display" style="font-size:1.05em;color:var(--butterInk);margin-top:10px;line-height:1">이강택</h3>
        <p style="font-size:0.5em;color:var(--inkSoft);margin-top:4px;line-height:1.3">역할</p>
      </div>

      <!-- 이정우 -->
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="aspect-ratio:0.47;width:100%;background:var(--surface);border:2px solid var(--skyInk);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <img src="https://images.prismic.io/minsung/aiEgBAeQX7-eWt74_jungwoo_face.png?auto=format,compress" alt="이정우" style="width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:56px;color:var(--skySoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <h3 class="font-display" style="font-size:1.05em;color:var(--skyInk);margin-top:10px;line-height:1">이정우</h3>
        <p style="font-size:0.5em;color:var(--inkSoft);margin-top:4px;line-height:1.3">역할</p>
      </div>

      <!-- 최민성 -->
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="aspect-ratio:0.47;width:100%;background:var(--surface);border:2px solid var(--babypink);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <img src="https://images.prismic.io/minsung/aiEgCAeQX7-eWt77_minsung_face.png?auto=format,compress" alt="최민성" style="width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:56px;color:var(--babypinkSoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <h3 class="font-display" style="font-size:1.05em;color:var(--babypink);margin-top:10px;line-height:1">최민성</h3>
        <p style="font-size:0.5em;color:var(--inkSoft);margin-top:4px;line-height:1.3">역할</p>
      </div>

    </div>

  </div>
  <aside class="notes">
    팀 6명 — 박우림 · 이지수 · 노영주 · 이강택 · 이정우 · 최민성. 사진 4명 (박우림/노영주/이강택/이정우) + placeholder 2명 (이지수/최민성).
    이름 아래 "역할" 자리는 추후 텍스트 채울 자리.
  </aside>
</section>
