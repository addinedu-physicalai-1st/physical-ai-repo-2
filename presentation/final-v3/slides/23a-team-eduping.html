<section>
  <div class="bg-deco">
    <div class="blob" style="width:320px;height:320px;background:var(--babypinkSoft);top:-100px;left:-80px;opacity:0.45"></div>
    <div class="blob float" style="width:220px;height:220px;background:var(--babypinkSoft);bottom:-60px;right:-40px;opacity:0.35"></div>
  </div>

  <div class="layer" style="padding:32px 60px 28px;height:720px;width:1280px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;z-index:1">

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
      <span style="font-family:'Jua';letter-spacing:0.3em;font-size:0.65em;color:var(--babypink)">TEAM · 01</span>
      <h2 class="font-display" style="font-size:1.7em;color:var(--ink);margin:0">EduPing · 양팔 로봇 팀</h2>
    </div>

    <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:32px;min-height:0">

      <!-- 박우림 -->
      <div style="display:flex;background:var(--surface);border:2px solid var(--babypink);border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,0.3)">
        <div style="width:50%;background:#0a0d14;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <img src="slides/assets/team/wurim_face.png" alt="박우림" style="width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:120px;color:var(--babypinkSoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <div style="flex:1;padding:22px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px">
          <h3 class="font-display" style="font-size:1.6em;color:var(--babypink);margin:0;line-height:1">박우림</h3>
          <p style="font-size:0.62em;color:var(--inkSoft);margin:0;line-height:1.55">원격 진찰<br>Doctor Telehealth<br>D435 PointCloud<br>임피던스 제어</p>
        </div>
      </div>

      <!-- 이정우 -->
      <div style="display:flex;background:var(--surface);border:2px solid var(--babypink);border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,0.3)">
        <div style="width:50%;background:#0a0d14;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <img src="slides/assets/team/jungwoo_face.png" alt="이정우" style="width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:120px;color:var(--babypinkSoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <div style="flex:1;padding:22px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px">
          <h3 class="font-display" style="font-size:1.6em;color:var(--babypink);margin:0;line-height:1">이정우</h3>
          <p style="font-size:0.62em;color:var(--inkSoft);margin:0;line-height:1.55">무궁화꽃 게임<br>등하원 출석<br>OpenArm 제어<br>Admin UI</p>
        </div>
      </div>

    </div>
  </div>

  <aside class="notes">EduPing(양팔 로봇) 팀 — 박우림, 이정우.</aside>
</section>
