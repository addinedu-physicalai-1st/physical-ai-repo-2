<section>
  <div class="bg-deco">
    <div class="blob" style="width:340px;height:340px;background:var(--babypinkSoft);top:-80px;left:-60px;opacity:0.4"></div>
    <div class="blob float" style="width:240px;height:240px;background:var(--mintSoft);bottom:-50px;right:60px;opacity:0.28"></div>
  </div>
  <div class="layer" style="padding:24px 48px;height:720px;width:1280px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;z-index:1">

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:22px">
      <span class="chip" style="font-size:0.55em;background:linear-gradient(90deg,var(--babypink),var(--lavInk));color:#fff;border:0">EDUPING · 모드 01</span>
      <h2 class="font-display" style="font-size:1.5em;color:var(--ink);margin:0">등 / 하원 + 하이파이브 기능 설명</h2>
    </div>

    <!-- 2-column body: hero image (left) + bullet cards (right) -->

    <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0">

      <!-- Left: hero GIF (closed-loop sim ↔ MuJoCo) -->
      <div style="display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;height:100%">
        <img src="https://images.prismic.io/joey/ah545AeQX7-eWhsl_hifive_sim.gif" alt="hifive sim closed-loop"
             style="max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:14px;border:1.5px solid var(--lavenderSoft)"/>
      </div>

      <!-- Right: bullet cards -->
      <div style="display:grid;grid-template-columns:1fr;grid-template-rows:repeat(3,1fr);gap:16px;min-height:0">

        <div style="background:var(--surface);border:1.5px solid var(--babypinkSoft);border-radius:12px;padding:20px 24px;display:flex;align-items:center;gap:26px">
          <div style="font-family:'Jua';font-size:1.05em;color:var(--babypink);letter-spacing:0.08em;flex:0 0 170px;white-space:nowrap;line-height:1.2">DEPTH → 3D</div>
          <p style="color:var(--ink);font-size:0.85em;margin:0;line-height:1.45">뎁스 카메라로 손 <b>3D 역투영</b><br>→ 로봇 목표점</p>
        </div>

        <div style="background:var(--surface);border:1.5px solid var(--lavenderSoft);border-radius:12px;padding:20px 24px;display:flex;align-items:center;gap:26px">
          <div style="font-family:'Jua';font-size:1.05em;color:var(--lavInk);letter-spacing:0.08em;flex:0 0 170px;line-height:1.2">CLOSED<br>LOOP</div>
          <p style="color:var(--ink);font-size:0.85em;margin:0;line-height:1.45">IK → FK 재측정 루프 →<br>오차 <b>20 cm → 2 cm</b></p>
        </div>

        <div style="background:var(--surface);border:1.5px solid var(--mintSoft);border-radius:12px;padding:20px 24px;display:flex;align-items:center;gap:26px">
          <div style="font-family:'Jua';font-size:1.05em;color:var(--mintInk);letter-spacing:0.08em;flex:0 0 170px;white-space:nowrap;line-height:1.2">디지털 트윈</div>
          <p style="color:var(--ink);font-size:0.85em;margin:0;line-height:1.45">MuJoCo 트윈에서 <b>안전·정량 검증</b><br>→ 실물 OpenArm 시연</p>
        </div>

      </div>
    </div>
  </div>
  <aside class="notes">
    등/하원 — 뎁스 + MediaPipe → 3D 손 역투영 → TRAC-IK → 5차 곡선 → closed-loop FK. 좌측 hifive_sim.gif 는 브라우저 ↔ MuJoCo 트윈 파란/빨간 공 수렴을 보여줌.
  </aside>
</section>
