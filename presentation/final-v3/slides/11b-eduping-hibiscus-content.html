<section>
  <div class="bg-deco">
    <div class="blob" style="width:340px;height:340px;background:var(--mintSoft);top:-80px;right:-80px;opacity:0.35"></div>
    <div class="blob float" style="width:220px;height:220px;background:var(--butterSoft);bottom:-50px;left:-30px;opacity:0.3"></div>
  </div>
  <div class="layer" style="padding:24px 48px;height:720px;width:1280px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;z-index:1">

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">
      <span class="chip" style="font-size:0.55em;background:linear-gradient(90deg,var(--mintInk),var(--babypink));color:#fff;border:0">EDUPING · 모드 03</span>
      <h2 class="font-display" style="font-size:1.5em;color:var(--ink);margin:0">무궁화 꽃이 피었습니다 기능 설명</h2>
    </div>

    <!-- 2-column body: hero image (left) + bullet cards (right) -->

    <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0">

      <!-- Left: hero GIF (real demo) — width:100% 로 column 폭 채움 -->
      <div style="display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;height:100%">
        <img src="https://images.prismic.io/joey/ah546geQX7-eWhsq_mugunghwa_real.gif" alt="mugunghwa real demo"
             style="width:100%;height:auto;max-height:100%;object-fit:contain;display:block;border-radius:14px;border:1.5px solid var(--mintSoft)"/>
      </div>

      <!-- Right: bullet cards (3 cards) -->
      <div style="display:grid;grid-template-columns:1fr;grid-template-rows:repeat(3,auto);gap:16px;min-height:0;align-content:center">

        <div style="background:var(--surface);border:1.5px solid var(--skySoft);border-radius:12px;padding:13px 20px;display:flex;align-items:center;gap:18px">
          <div style="font-family:'Jua';font-size:1.05em;color:var(--skyInk);letter-spacing:0.08em;flex:0 0 150px;line-height:1.2;white-space:nowrap">단일 시계</div>
          <p style="color:var(--ink);font-size:0.85em;margin:0;line-height:1.45"><b>audio.currentTime</b> 하나로 박자 변주에도 팔이 노래에 정확히 동기</p>
        </div>

        <div style="background:var(--surface);border:1.5px solid var(--babypinkSoft);border-radius:12px;padding:13px 20px;display:flex;align-items:center;gap:18px">
          <div style="font-family:'Jua';font-size:1.05em;color:var(--babypink);letter-spacing:0.08em;flex:0 0 150px;line-height:1.2;white-space:nowrap">다중 인식</div>
          <p style="color:var(--ink);font-size:0.85em;margin:0;line-height:1.45">MediaPipe + IoU 트래커 + <b>InsightFace 코사인 거리</b></p>
        </div>

        <div style="background:var(--surface);border:1.5px solid var(--butterSoft);border-radius:12px;padding:13px 20px;display:flex;align-items:center;gap:18px">
          <div style="font-family:'Jua';font-size:1.05em;color:var(--butterInk);letter-spacing:0.08em;flex:0 0 150px;line-height:1.2;white-space:nowrap">움직임 판정</div>
          <p style="color:var(--ink);font-size:0.85em;margin:0;line-height:1.45"><b>SAD + 2단 임계 + self-filter</b> · 연속 3회 → 오탐 최소화</p>
        </div>

      </div>
    </div>
  </div>
  <aside class="notes">
    무궁화 꽃이 피었습니다 — 6단계 상태머신, audio.currentTime 단일 시계로 노래·팔·관찰 동기. 좌측 mugunghwa_real.gif 실물 시연.
  </aside>
</section>
