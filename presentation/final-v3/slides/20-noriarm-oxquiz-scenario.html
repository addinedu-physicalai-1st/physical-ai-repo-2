<section>
  <style>
    .scn-lav{position:relative;width:1280px;height:720px;padding:60px 80px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
    .scn-lav h2{font-family:'Jua';font-size:1.65em;color:var(--ink);margin:0 0 50px}
    .scn-lav .row{display:flex;align-items:center;justify-content:center;gap:14px}
    .scn-lav .blk{display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(168,85,247,0.16);border:2px solid var(--lavInk);border-radius:18px;padding:22px 26px;min-width:200px;box-shadow:0 8px 24px rgba(168,85,247,0.32)}
    .scn-lav .blk .n{font-family:'Jua';font-size:34px;color:var(--lavInk);line-height:1}
    .scn-lav .blk .l{font-family:'Jua';font-size:21px;color:var(--ink);line-height:1.2;text-align:center}
    .scn-lav .arr{font-size:38px;color:var(--lavInk);font-weight:700;flex:0 0 auto}
  </style>
  <div class="bg-deco">
    <div class="blob" style="width:340px;height:340px;background:var(--lavenderSoft);top:-90px;right:-70px;opacity:0.35"></div>
    <div class="blob float" style="width:240px;height:240px;background:var(--skySoft);bottom:-60px;left:-40px;opacity:0.3"></div>
  </div>
  <div class="layer scn-lav">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:80px">
      <span class="chip" style="font-size:0.55em;background:var(--lavInk);color:#fff;border:0">NORIARM · 2</span>
      <h2>OX 퀴즈 — 시나리오</h2>
    </div>
    <div class="row">
      <div class="blk"><span class="n">1</span><span class="l">문제 출제</span></div>
      <span class="arr">→</span>
      <div class="blk"><span class="n">2</span><span class="l">손 검출</span></div>
      <span class="arr">→</span>
      <div class="blk"><span class="n">3</span><span class="l">위치 판정</span></div>
      <span class="arr">→</span>
      <div class="blk"><span class="n">4</span><span class="l">정답 표시</span></div>
    </div>
  </div>
  <aside class="notes">OX 퀴즈 4단계 시나리오.</aside>
</section>
