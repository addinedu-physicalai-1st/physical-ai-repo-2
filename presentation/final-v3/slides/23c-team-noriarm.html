<section>
  <div class="bg-deco">
    <div class="blob" style="width:320px;height:320px;background:var(--butterSoft);top:-100px;left:-80px;opacity:0.45"></div>
    <div class="blob float" style="width:220px;height:220px;background:var(--butterSoft);bottom:-60px;right:-40px;opacity:0.35"></div>
  </div>

  <div class="layer" style="padding:32px 60px 28px;height:720px;width:1280px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;z-index:1">

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
      <span style="font-family:'Jua';letter-spacing:0.3em;font-size:0.65em;color:var(--butterInk)">TEAM · 03</span>
      <h2 class="font-display" style="font-size:1.7em;color:var(--ink);margin:0">NoriArm · 매니퓰레이터 팀</h2>
    </div>

    <div style="flex:1;display:flex;justify-content:space-around;align-items:center;gap:32px;min-height:0">

      <!-- 이지수 -->
      <div style="display:flex;align-items:stretch;background:var(--surface);height:580px;border:2px solid var(--butterInk);border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,0.3)">
        <div class="team-photo-box" style="width:273px;height:100%;background:#0a0d14;overflow:hidden;position:relative">
          <img src="slides/assets/team/jisoo.png?v=18" alt="이지수" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:120px;color:var(--butterSoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <div style="width:273px;height:100%;padding:32px 24px;display:flex;flex-direction:column;justify-content:center;gap:24px;box-sizing:border-box">
          <div>
            <h3 class="font-display" style="font-size:1.7em;color:var(--butterInk);margin:0 0 8px;line-height:1">이지수</h3>
            <div style="height:2px;background:linear-gradient(90deg,var(--butterInk),transparent);border-radius:1px"></div>
          </div>
          <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:18px">
            <li style="min-height:54px;display:flex;align-items:center;gap:12px;font-size:0.78em;color:var(--ink);line-height:1.2">
              <span class="material-icons-round" style="font-size:22px;color:var(--butterInk);flex-shrink:0">view_in_ar</span>
              <span>블록쌓기<br><span style="font-size:0.78em;color:var(--inkSoft);letter-spacing:0.04em">ACT</span></span>
            </li>
            <li style="min-height:54px;display:flex;align-items:center;gap:12px;font-size:0.78em;color:var(--ink);line-height:1.25">
              <span class="material-icons-round" style="font-size:22px;color:var(--butterInk);flex-shrink:0">palette</span>
              <span>HSV 추론</span>
            </li>
            <li style="min-height:54px;display:flex;align-items:center;gap:12px;font-size:0.78em;color:var(--ink);line-height:1.2">
              <span class="material-icons-round" style="font-size:22px;color:var(--butterInk);flex-shrink:0">quiz</span>
              <span>OX 퀴즈</span>
            </li>
          </ul>
        </div>
      </div>

      <!-- 최민성 -->
      <div style="display:flex;align-items:stretch;background:var(--surface);height:580px;border:2px solid var(--butterInk);border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,0.3)">
        <div class="team-photo-box" style="width:273px;height:100%;background:#0a0d14;overflow:hidden;position:relative">
          <img src="slides/assets/team/minsung.png?v=18" alt="최민성" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:120px;color:var(--butterSoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <div style="width:273px;height:100%;padding:32px 24px;display:flex;flex-direction:column;justify-content:center;gap:24px;box-sizing:border-box">
          <div>
            <h3 class="font-display" style="font-size:1.7em;color:var(--butterInk);margin:0 0 8px;line-height:1">최민성</h3>
            <div style="height:2px;background:linear-gradient(90deg,var(--butterInk),transparent);border-radius:1px"></div>
          </div>
          <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:18px">
            <li style="min-height:54px;display:flex;align-items:center;gap:12px;font-size:0.78em;color:var(--ink);line-height:1.25">
              <span class="material-icons-round" style="font-size:22px;color:var(--butterInk);flex-shrink:0">storefront</span>
              <span>가게놀이<br><span style="font-size:0.78em;color:var(--inkSoft);letter-spacing:0.04em">ACT</span></span>
            </li>
            <li style="min-height:54px;display:flex;align-items:center;gap:12px;font-size:0.78em;color:var(--ink);line-height:1.2">
              <span class="material-icons-round" style="font-size:22px;color:var(--butterInk);flex-shrink:0">crop_free</span>
              <span>YOLO ROI 마스킹</span>
            </li>
            <li style="min-height:54px;display:flex;align-items:center;gap:12px;font-size:0.78em;color:var(--ink);line-height:1.2">
              <span class="material-icons-round" style="font-size:22px;color:var(--butterInk);flex-shrink:0">slideshow</span>
              <span>발표</span>
            </li>
          </ul>
        </div>
      </div>

    </div>
  </div>

  <aside class="notes">NoriArm(매니퓰레이터) 팀 — 이지수(블록쌓기·ACT학습·OX퀴즈), 최민성(가게놀이·YOLO ROI·발표).</aside>
</section>
