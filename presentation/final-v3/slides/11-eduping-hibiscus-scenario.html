<section>
  <style>
    .scn-pink{position:relative;width:1280px;height:720px;padding:60px 80px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
    .scn-pink h2{font-family:'Jua';font-size:1.65em;color:var(--ink);margin:0 0 50px}
    .scn-pink .row{display:flex;align-items:center;justify-content:center;gap:14px}
    .scn-pink .blk{display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(244,114,182,0.16);border:2px solid var(--babypink);border-radius:18px;padding:22px 26px;min-width:180px;box-shadow:0 8px 24px rgba(244,114,182,0.32)}
    .scn-pink .blk .n{font-family:'Jua';font-size:34px;color:var(--babypink);line-height:1}
    .scn-pink .blk .l{font-family:'Jua';font-size:22px;color:var(--ink);line-height:1}
    .scn-pink .arr{font-size:38px;color:var(--babypink);font-weight:700;flex:0 0 auto}
  </style>
  <div class="bg-deco">
    <div class="blob" style="width:340px;height:340px;background:var(--mintSoft);top:-90px;right:-70px;opacity:0.32"></div>
    <div class="blob float" style="width:240px;height:240px;background:var(--babypinkSoft);bottom:-60px;left:-40px;opacity:0.3"></div>
  </div>
  <div class="layer scn-pink">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:30px">
      <span class="chip" style="font-size:0.55em">EDUPING · 모드 3</span>
      <h2>무궁화 꽃이 피었습니다 — 시나리오</h2>
    </div>
    <div class="row" style="gap:12px">
      <div class="blk" style="min-width:160px"><span class="n">1</span><span class="l">진입</span></div>
      <span class="arr" style="font-size:32px">→</span>
      <div class="blk" style="min-width:160px"><span class="n">2</span><span class="l">준비</span></div>
      <span class="arr" style="font-size:32px">→</span>
      <div class="blk" style="min-width:170px"><span class="n">3</span><span class="l">노래 + 관찰</span></div>
      <span class="arr" style="font-size:32px">→</span>
      <div class="blk" style="min-width:160px"><span class="n">4</span><span class="l">탈락</span></div>
      <span class="arr" style="font-size:32px">→</span>
      <div class="blk" style="min-width:160px"><span class="n">5</span><span class="l">종료</span></div>
    </div>
  </div>
  <aside class="notes">무궁화 4단계 시나리오 미리보기.</aside>
</section>
