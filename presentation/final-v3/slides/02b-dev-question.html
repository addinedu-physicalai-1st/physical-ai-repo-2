<section class="title-slide">
  <div class="bg-deco">
    <!-- 큰 액센트 블롭 — '무엇' 뒤에 위치 -->
    <div class="blob" style="width:520px;height:520px;background:radial-gradient(circle, var(--babypinkSoft) 0%, transparent 70%);top:90px;left:50%;transform:translateX(-50%);opacity:0.9"></div>
    <div class="blob" style="width:320px;height:320px;background:var(--mintSoft);top:-90px;right:-60px"></div>
    <div class="blob" style="width:260px;height:260px;background:var(--lavenderSoft);bottom:-80px;left:-30px"></div>
    <div class="blob float" style="width:180px;height:180px;background:var(--butterSoft);top:60px;left:80px"></div>
    <div class="dots"></div>

    <!-- 떠있는 작은 점들 (액센트) -->
    <span style="position:absolute;top:140px;right:160px;width:14px;height:14px;background:var(--babypink);border-radius:50%;opacity:0.85"></span>
    <span style="position:absolute;top:240px;left:140px;width:10px;height:10px;background:var(--mintInk);border-radius:50%;opacity:0.8"></span>
    <span style="position:absolute;bottom:120px;right:240px;width:8px;height:8px;background:var(--butter);border-radius:50%;opacity:0.9"></span>
    <span style="position:absolute;top:480px;left:80px;width:24px;height:24px;border:3px solid var(--lavInk);border-radius:50%;opacity:0.7"></span>
    <span style="position:absolute;bottom:90px;left:280px;width:32px;height:6px;background:var(--skyInk);border-radius:999px;opacity:0.6"></span>
  </div>

  <div class="layer flex flex-col items-center justify-center text-center" style="min-height:680px;padding:0 60px;position:relative;z-index:2">

    <p class="r font-display" style="--i:0;font-size:1.5em;color:var(--inkSoft);margin:0;letter-spacing:-0.01em">
      그래서, 우리는
    </p>

    <h1 class="r font-display" style="--i:1;font-size:9em;line-height:1;margin:6px 0;letter-spacing:-0.04em;background:linear-gradient(135deg, var(--babypink), var(--lavInk));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">
      무엇
    </h1>

    <p class="r font-display" style="--i:2;font-size:1.8em;color:var(--ink);margin:0;letter-spacing:-0.01em">
      을 만들어야 했나<span style="color:var(--babypink)">?</span>
    </p>

    <div class="r" style="--i:3;margin-top:36px;display:flex;align-items:center;gap:12px">
      <span style="width:36px;height:3px;background:var(--babypink);border-radius:999px"></span>
      <span style="width:8px;height:3px;background:var(--mintInk);border-radius:999px"></span>
      <span style="width:8px;height:3px;background:var(--butter);border-radius:999px"></span>
      <span style="width:8px;height:3px;background:var(--lavInk);border-radius:999px"></span>
    </div>

  </div>
</section>
