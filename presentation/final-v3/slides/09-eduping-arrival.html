<section data-arch-flow>
  <style>
    .ovr-flow{position:absolute;top:14px;left:14px;right:14px;z-index:5;display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:none}
    .ovr-flow .n{display:flex;align-items:center;gap:8px;background:rgba(15,18,28,0.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid rgba(244,114,182,0.4);border-radius:10px;padding:7px 14px;opacity:0.55;filter:saturate(0.65);transform:scale(0.97);transition:all .35s cubic-bezier(0.2,0.8,0.2,1)}
    .ovr-flow .n.on{opacity:1;filter:none;transform:scale(1.04);background:rgba(244,114,182,0.92);border-color:var(--babypink);box-shadow:0 0 24px rgba(244,114,182,0.55)}
    .ovr-flow .n .num{font-family:'Jua';font-size:14px;color:var(--babypink);width:18px;text-align:center;flex:0 0 auto}
    .ovr-flow .n.on .num{color:#fff}
    .ovr-flow .n .lab{font-family:'Jua';font-size:13px;color:#fff;letter-spacing:0.02em}
    .ovr-flow .arrow{font-size:18px;color:rgba(244,114,182,0.45);font-weight:700;flex:0 0 auto;transition:color .35s}
    .ovr-flow .arrow.on{color:var(--babypink)}
    .arr-drv{position:absolute;left:-9999px;top:-9999px}
  </style>

  <div style="padding:24px 60px 36px;height:720px;width:1280px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="chip" style="font-size:0.55em">EDUPING · 모드 1</span>
      <h2 class="font-display" style="font-size:1.6em;color:var(--ink);margin:0">등하원 — 얼굴 인식 + 하이파이브</h2>
    </div>

    <!-- 영상 frame — 외곽선이 영상 크기에 맞도록 aspect-ratio wrapper -->
    <div style="flex:1;display:flex;align-items:center;justify-content:center;min-height:0">
      <div style="position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;height:100%;border:1px solid var(--border);border-radius:14px;overflow:hidden">

        <!-- overlay 블록 (영상 상단) -->
        <div class="ovr-flow">
          <div class="n" data-step="1,2,3,4"><span class="num">1</span><span class="lab">얼굴 인식</span></div>
          <span class="arrow" data-flow="2,3,4">→</span>
          <div class="n" data-step="2,3,4"><span class="num">2</span><span class="lab">DB 매칭</span></div>
          <span class="arrow" data-flow="3,4">→</span>
          <div class="n" data-step="3,4"><span class="num">3</span><span class="lab">손 탐색</span></div>
          <span class="arrow" data-flow="4">→</span>
          <div class="n" data-step="4"><span class="num">4</span><span class="lab">하이파이브</span></div>
        </div>

        <video src="slides/assets/media/eduping/highfive.mp4" loop playsinline data-press-to-play
               style="width:100%;height:100%;object-fit:cover;display:block"
               onerror="this.outerHTML='&lt;div style=&quot;color:var(--inkSoft);text-align:center;padding:40px&quot;&gt;&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:60px&quot;&gt;videocam_off&lt;/span&gt;&lt;p style=&quot;margin-top:12px;font-size:0.85em&quot;&gt;assets/media/eduping/highfive.mp4&lt;/p&gt;&lt;/div&gt;'"></video>
      </div>
    </div>

    <!-- driver fragments — 화살표 키로 step 1→2→3→4 진행 -->
    <div class="arr-drv" aria-hidden="true">
      <span class="fragment" data-archstep="1"></span>
      <span class="fragment" data-archstep="2"></span>
      <span class="fragment" data-archstep="3"></span>
      <span class="fragment" data-archstep="4"></span>
    </div>
  </div>

  <aside class="notes">
    등하원 — 영상 frame 상단에 4단계 블록 overlay. 화살표 키마다 다음 블록 강조.
  </aside>
</section>
