<section>
  <div class="bg-deco">
    <div class="blob" style="width:300px;height:300px;background:var(--babypinkSoft);top:-80px;right:-60px;opacity:0.4"></div>
    <div class="blob" style="width:260px;height:260px;background:var(--mintSoft);bottom:-70px;left:-40px;opacity:0.35"></div>
  </div>

  <div class="layer" style="padding:42px 60px;height:720px;width:1280px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;z-index:1">

    <div style="border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:26px">
      <p style="color:var(--inkSoft);font-family:'Jua';letter-spacing:0.4em;font-size:0.65em;margin:0">─ AGENDA ─</p>
      <h2 class="font-display" style="font-size:1.7em;color:var(--ink);margin:6px 0 0">오늘 보여드릴 6 파트</h2>
    </div>

    <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:18px 36px;min-height:0">

      <div style="display:flex;align-items:center;gap:20px">
        <span class="font-display" style="font-size:3.6em;line-height:0.85;color:transparent;-webkit-text-stroke:2.5px var(--skyInk);letter-spacing:-0.04em">01</span>
        <span style="width:4px;height:50px;background:var(--skyInk);border-radius:999px;flex:0 0 auto"></span>
        <div style="min-width:0">
          <p style="color:var(--skyInk);font-family:'Jua';letter-spacing:0.18em;font-size:0.55em;margin:0">SYSTEM</p>
          <h3 class="font-display" style="font-size:1.05em;color:var(--ink);margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">시스템 · 기술 스택</h3>
          <p style="color:var(--inkSoft);font-size:0.6em;margin:0">하드웨어 · 아키텍처</p>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:20px">
        <span class="font-display" style="font-size:3.6em;line-height:0.85;color:transparent;-webkit-text-stroke:2.5px var(--babypink);letter-spacing:-0.04em">02</span>
        <span style="width:4px;height:50px;background:var(--babypink);border-radius:999px;flex:0 0 auto"></span>
        <div style="min-width:0">
          <p style="color:var(--babypink);font-family:'Jua';letter-spacing:0.18em;font-size:0.55em;margin:0">EDUPING</p>
          <h3 class="font-display" style="font-size:1.05em;color:var(--ink);margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">환영 · 놀이 · 진찰</h3>
          <p style="color:var(--inkSoft);font-size:0.6em;margin:0">등하원 · 율동 · 무궁화 · 진찰</p>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:20px">
        <span class="font-display" style="font-size:3.6em;line-height:0.85;color:transparent;-webkit-text-stroke:2.5px var(--mintInk);letter-spacing:-0.04em">03</span>
        <span style="width:4px;height:50px;background:var(--mintInk);border-radius:999px;flex:0 0 auto"></span>
        <div style="min-width:0">
          <p style="color:var(--mintInk);font-family:'Jua';letter-spacing:0.18em;font-size:0.55em;margin:0">GOGOPING</p>
          <h3 class="font-display" style="font-size:1.05em;color:var(--ink);margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">동행 · 운반 · 자장가</h3>
          <p style="color:var(--inkSoft);font-size:0.6em;margin:0">추종 · 운반 · 숨바꼭질 · 자장가</p>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:20px">
        <span class="font-display" style="font-size:3.6em;line-height:0.85;color:transparent;-webkit-text-stroke:2.5px var(--lavInk);letter-spacing:-0.04em">04</span>
        <span style="width:4px;height:50px;background:var(--lavInk);border-radius:999px;flex:0 0 auto"></span>
        <div style="min-width:0">
          <p style="color:var(--lavInk);font-family:'Jua';letter-spacing:0.18em;font-size:0.55em;margin:0">NORIARM</p>
          <h3 class="font-display" style="font-size:1.05em;color:var(--ink);margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">교실 놀이 친구</h3>
          <p style="color:var(--inkSoft);font-size:0.6em;margin:0">블럭쌓기 · OX 퀴즈 · 가게놀이</p>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:20px">
        <span class="font-display" style="font-size:3.6em;line-height:0.85;color:transparent;-webkit-text-stroke:2.5px var(--butterInk);letter-spacing:-0.04em">05</span>
        <span style="width:4px;height:50px;background:var(--butterInk);border-radius:999px;flex:0 0 auto"></span>
        <div style="min-width:0">
          <p style="color:var(--butterInk);font-family:'Jua';letter-spacing:0.18em;font-size:0.55em;margin:0">SPRINT</p>
          <h3 class="font-display" style="font-size:1.05em;color:var(--ink);margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">스프린트 관리</h3>
          <p style="color:var(--inkSoft);font-size:0.6em;margin:0">Jira 보드 · 역할 분담</p>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:20px">
        <span class="font-display" style="font-size:3.6em;line-height:0.85;color:transparent;-webkit-text-stroke:2.5px var(--inkSoft);letter-spacing:-0.04em">06</span>
        <span style="width:4px;height:50px;background:var(--inkSoft);border-radius:999px;flex:0 0 auto"></span>
        <div style="min-width:0">
          <p style="color:var(--inkSoft);font-family:'Jua';letter-spacing:0.18em;font-size:0.55em;margin:0">ENDING</p>
          <h3 class="font-display" style="font-size:1.05em;color:var(--ink);margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">팀 · 엔딩 · Q&amp;A</h3>
          <p style="color:var(--inkSoft);font-size:0.6em;margin:0">팀 6명 · 마무리 · 질의응답</p>
        </div>
      </div>

    </div>

  </div>
</section>
