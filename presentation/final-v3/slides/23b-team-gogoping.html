<section>
  <div class="bg-deco">
    <div class="blob" style="width:320px;height:320px;background:var(--mintSoft);top:-100px;left:-80px;opacity:0.45"></div>
    <div class="blob float" style="width:220px;height:220px;background:var(--mintSoft);bottom:-60px;right:-40px;opacity:0.35"></div>
  </div>

  <div class="layer" style="padding:32px 60px 28px;height:720px;width:1280px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;z-index:1">

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
      <span style="font-family:'Jua';letter-spacing:0.3em;font-size:0.65em;color:var(--mintInk)">TEAM · 02</span>
      <h2 class="font-display" style="font-size:1.7em;color:var(--ink);margin:0">GogoPing · 자율주행 팀</h2>
    </div>

    <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:32px;min-height:0">

      <!-- 노영주 -->
      <div style="display:flex;background:var(--surface);border:2px solid var(--mintInk);border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,0.3)">
        <div style="width:50%;background:#0a0d14;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <img src="slides/assets/team/youngju_face.jpg" alt="노영주" style="width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:120px;color:var(--mintSoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <div style="flex:1;padding:22px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px">
          <h3 class="font-display" style="font-size:1.6em;color:var(--mintInk);margin:0;line-height:1">노영주</h3>
          <p style="font-size:0.62em;color:var(--inkSoft);margin:0;line-height:1.55">교사 추종<br>Follow Mode<br>YOLO + ByteTrack + ReID<br>WebRTC 영상</p>
        </div>
      </div>

      <!-- 이강택 -->
      <div style="display:flex;background:var(--surface);border:2px solid var(--mintInk);border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,0.3)">
        <div style="width:50%;background:#0a0d14;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <img src="slides/assets/team/kangtaek_face.png" alt="이강택" style="width:100%;height:100%;object-fit:cover;object-position:center top"
               onerror="this.outerHTML='&lt;span class=&quot;material-icons-round&quot; style=&quot;font-size:120px;color:var(--mintSoft)&quot;&gt;person&lt;/span&gt;'"/>
        </div>
        <div style="flex:1;padding:22px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px">
          <h3 class="font-display" style="font-size:1.6em;color:var(--mintInk);margin:0;line-height:1">이강택</h3>
          <p style="font-size:0.62em;color:var(--inkSoft);margin:0;line-height:1.55">SLAM · Navigation<br>Nav2 · Path Planner<br>VicPinky 베이스<br>행동트리 (py_trees)</p>
        </div>
      </div>

    </div>
  </div>

  <aside class="notes">GogoPing(자율주행) 팀 — 노영주, 이강택.</aside>
</section>
