<section>
  <div class="bg-deco">
    <div class="blob" style="width:320px;height:320px;background:var(--butterSoft);top:-90px;left:-60px;opacity:0.4"></div>
    <div class="blob float" style="width:220px;height:220px;background:var(--mintSoft);bottom:-50px;right:-30px;opacity:0.28"></div>
  </div>
  <div class="layer" style="padding:32px 48px;height:720px;width:1280px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;z-index:1">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:22px">
      <span class="chip" style="font-size:0.55em;background:linear-gradient(90deg,var(--butterInk),var(--mintInk));color:#fff;border:0">NORIARM · 1</span>
      <h2 class="font-display" style="font-size:1.5em;color:var(--ink);margin:0">블럭쌓기 기능 설명</h2>
    </div>

    <div style="flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;min-height:0">
      <!-- LEFT image — border wraps the actual image, not the container -->
      <div style="display:flex;align-items:center;justify-content:center;min-height:0">
        <img src="slides/assets/media/noriarm/blocks-pickup-area.png" alt="픽업 영역 확장"
             style="max-width:100%;max-height:100%;object-fit:contain;border:1.5px solid var(--butterInk);border-radius:14px;box-shadow:0 6px 20px rgba(245,158,11,0.22);display:block"/>
      </div>

      <!-- RIGHT: 4 compact cards (no icons) -->
      <div style="display:flex;flex-direction:column;gap:14px">

        <div style="background:var(--surface);border:1px solid rgba(245,158,11,0.3);border-left:4px solid var(--butterInk);border-radius:10px;padding:16px 22px;flex:1;display:flex;flex-direction:column;justify-content:center">
          <div style="font-family:'Jua';font-size:0.85em;color:var(--butterInk);line-height:1;margin-bottom:8px">데이터셋 611 epi</div>
          <p style="color:var(--ink);font-size:0.7em;margin:0;line-height:1.5">
            사람·로봇 4턴 (파랑 → 노랑 → 초록 → 흰)
          </p>
        </div>

        <div style="background:var(--surface);border:1px solid rgba(74,222,128,0.3);border-left:4px solid var(--mintInk);border-radius:10px;padding:16px 22px;flex:1;display:flex;flex-direction:column;justify-content:center">
          <div style="font-family:'Jua';font-size:0.85em;color:var(--mintInk);line-height:1;margin-bottom:8px">lerobot ACT · 누적 197만 step</div>
          <p style="color:var(--ink);font-size:0.7em;margin:0;line-height:1.5">
            <b>OMX-F 5축 팔</b> · 모방학습 · 기존 모델에 부족 부분만 추가
          </p>
        </div>

        <div style="background:var(--surface);border:1px solid rgba(96,165,250,0.3);border-left:4px solid var(--skyInk);border-radius:10px;padding:16px 22px;flex:1;display:flex;flex-direction:column;justify-content:center">
          <div style="font-family:'Jua';font-size:0.85em;color:var(--skyInk);line-height:1;margin-bottom:8px">픽업 영역 확장</div>
          <p style="color:var(--ink);font-size:0.7em;margin:0;line-height:1.5">
            좁은 박스 → <b>전체 작업 영역</b> 어디서나 픽업
          </p>
        </div>

        <div style="background:var(--surface);border:1px solid rgba(244,114,182,0.3);border-left:4px solid var(--babypink);border-radius:10px;padding:16px 22px;flex:1;display:flex;flex-direction:column;justify-content:center">
          <div style="font-family:'Jua';font-size:0.85em;color:var(--babypink);line-height:1;margin-bottom:8px">ROI 보완 (HSV)</div>
          <p style="color:var(--ink);font-size:0.7em;margin:0;line-height:1.5">
            환경 변화로 회귀 → 재학습 대신 <b>HSV 마스킹</b>
          </p>
        </div>

      </div>
    </div>
  </div>
  <aside class="notes">
    블럭쌓기 — tagline 삭제, 아이콘 삭제, sub-line 삭제. 4 카드 (데이터셋 / ACT 학습 / 픽업 영역 / ROI 보완) 만.
  </aside>
</section>
