<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>pingdergarten — 사랑의 에듀핑</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css" id="theme" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Material+Icons+Round&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream:    '#16131F',
            surface:  '#241F33',
            babypink: '#FF6F86',
            babypinkSoft: 'rgba(255,111,134,0.16)',
            mint:     '#3FD9A6',
            mintSoft: 'rgba(63,217,166,0.16)',
            butter:   '#FFD25E',
            butterSoft: 'rgba(255,210,94,0.16)',
            lavender: '#B98CFF',
            lavenderSoft: 'rgba(185,140,255,0.16)',
            sky:      '#5BB6FF',
            skySoft:  'rgba(91,182,255,0.16)',
            ink:      '#F4EFE8',
            inkSoft:  '#A79FB4',
            border:   'rgba(255,255,255,0.10)',
          },
          fontFamily: {
            display: ['"Jua"', '"Pretendard Variable"', 'system-ui', 'sans-serif'],
            body:    ['"Pretendard Variable"', 'system-ui', 'sans-serif'],
          },
          fontSize: {
            'em-3xs': '0.4em',
            'em-2xs': '0.5em',
            'em-xs':  '0.6em',
            'em-sm':  '0.75em',
            'em-md':  '1em',
            'em-lg':  '1.25em',
            'em-xl':  '1.5em',
            'em-2xl': '1.875em',
            'em-3xl': '2.25em',
            'em-4xl': '3em',
            'em-5xl': '3.75em',
            'em-6xl': '4.5em',
            'em-7xl': '5.25em',
            'em-8xl': '6em',
            'em-9xl': '7em',
            'em-10xl':'8em',
          },
          boxShadow: {
            soft:  '0 4px 16px rgba(248, 180, 196, 0.18)',
            puffy: '0 10px 30px rgba(201, 182, 228, 0.22)',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="bg-cream font-body text-ink">

  <!-- Loading screen -->
  <div id="loading-screen" class="fixed inset-0 z-[9999] flex items-center justify-center bg-cream">
    <div class="text-center">
      <div class="text-em-2xl font-display text-babypink mb-4">사랑의 에듀핑</div>
      <div class="flex justify-center gap-2">
        <span class="loading-dot" style="background:#FF6F86"></span>
        <span class="loading-dot" style="background:#3FD9A6"></span>
        <span class="loading-dot" style="background:#FFD25E"></span>
        <span class="loading-dot" style="background:#B98CFF"></span>
      </div>
    </div>
  </div>

  <!-- Reveal -->
  <div class="reveal">
    <div class="slides">
      <!-- Slides loaded dynamically by js/main.js -->
    </div>
  </div>

  <!-- Drawing canvas overlay -->
  <canvas id="draw-canvas" class="fixed inset-0 z-[100]" style="pointer-events:none"></canvas>

  <!-- Webcam overlay -->
  <div id="webcam-overlay" class="fixed bottom-4 right-4 z-[200] rounded-2xl overflow-hidden shadow-puffy" style="display:none;background:#241F33;border:3px solid #FF6F86">
    <video id="webcam-video" autoplay playsinline muted style="display:none"></video>
    <canvas id="webcam-canvas" style="width:240px;height:180px;display:block"></canvas>
  </div>

  <!-- Slide thumbnail panel -->
  <div id="slide-panel-overlay" class="hidden fixed inset-0 z-[300] bg-ink/30" onclick="closeSlidePanel()"></div>
  <aside id="slide-panel" class="hidden fixed top-0 right-0 z-[301] h-full w-[280px] bg-surface shadow-puffy flex-col">
    <header class="px-4 py-3 border-b border-border flex items-center justify-between">
      <span class="font-display text-em-md text-ink">슬라이드</span>
      <button onclick="closeSlidePanel()" class="text-inkSoft hover:text-babypink text-xl leading-none">×</button>
    </header>
    <button id="pdf-export-btn" onclick="exportPDF()" title="모든 슬라이드를 PDF 한 파일로 (단축키 E)"
            class="mx-3 mt-3 px-3 py-2 rounded-xl bg-babypinkSoft text-babypink font-display text-em-sm flex items-center justify-center gap-2 hover:bg-babypink hover:text-cream transition-colors">
      <span class="mi material-icons-round" style="font-size:1.15em">picture_as_pdf</span>
      전체 슬라이드 PDF로 내보내기
    </button>
    <div id="slide-panel-list" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
  </aside>

  <!-- Image zoom lightbox -->
  <div id="image-zoom-overlay"
       class="fixed inset-0 z-[400] cursor-zoom-out"
       style="display:none;background:rgba(8,6,12,0.92);align-items:center;justify-content:center;padding:40px"
       onclick="closeImageZoom()">
    <img id="image-zoom-img" src="" alt="" style="max-width:92vw;max-height:92vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5)" />
  </div>

  <!-- PDF export progress toast -->
  <div id="pdf-export-toast"></div>

  <!-- Fullscreen hint -->
  <div id="fullscreen-hint" class="fixed bottom-3 left-3 z-[50] text-em-3xs text-inkSoft" style="font-size:11px">
    Press <kbd style="background:#241F33;border:1px solid rgba(255,255,255,0.14);border-radius:4px;padding:1px 5px;font-size:0.9em;color:#F4EFE8">F</kbd> for fullscreen
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <!-- PDF 내보내기 (인쇄 대화상자 미사용): 슬라이드 → 캔버스 → jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
